                  $ref: '#/components/schemas/Budget'
    post:
      tags: [Budgets]
      summary: Create a budget
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetCreateRequest'
      responses:
        '201':
          description: Budget created, with amount_spent at zero
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Budget'
        '400':
          description: >-
            INVALID_BODY | BUDGET_LABEL_REQUIRED | BUDGET_LABEL_TOO_LONG (more
            than 100 characters) | BUDGET_INVALID_LIMIT (amount_limit is not
            greater than zero) | BUDGET_INVALID_FIELD (currency other than CRC or
            USD, period other than monthly, icon over 50 characters or color over
