    post:
      tags: [Recurring]
      summary: Create a recurring payment reminder
      description: Nothing is scheduled to charge or send money on next_date.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringPaymentCreateRequest'
      responses:
        '201':
          description: Reminder created and enabled
          content:
            application/json:
