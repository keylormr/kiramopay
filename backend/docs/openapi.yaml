  # ── Budgets ────────────────────────────────────────────────────────────
  /api/v1/budgets:
    get:
      tags: [Budgets]
      summary: List the person's budgets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Budgets, oldest first (may be empty)
          content:
            application/json:
              schema:
                type: array
