  /api/v1/loyalty/rewards:
    get:
      tags: [Loyalty]
      summary: Get available rewards catalog
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Rewards catalog

  /api/v1/loyalty/redeem:
    post:
      tags: [Loyalty]
      summary: Redeem a reward
      description: >-
        Only rewards with a way to be delivered can be redeemed — today, the
        cashback ones (`cashback_minor`). The cashback is a real ledger posting
        from SYSTEM:PROMOTIONS:CRC to the wallet, in the same transaction that
        deducts the points; if the promotions fund cannot cover it, nothing
        happens.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reward_id]
              properties:
