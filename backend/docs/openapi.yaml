        '400':
          description: >-
            INVALID_BODY | RECURRING_LABEL_REQUIRED | RECURRING_LABEL_TOO_LONG
            (more than 200 characters) | RECURRING_INVALID_AMOUNT |
            RECURRING_INVALID_TYPE | RECURRING_INVALID_FREQUENCY |
            RECURRING_INVALID_DATE (next_date is not a YYYY-MM-DD date) |
            RECURRING_INVALID_FIELD (currency other than CRC or USD, or a
            recipient field longer than its column)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/recurring/{id}:
    patch:
      tags: [Recurring]
      summary: Change a reminder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringPaymentUpdateRequest'
      responses:
        '200':
          description: Reminder updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: boolean }
        '400':
          description: >-
            INVALID_BODY | RECURRING_LABEL_REQUIRED | RECURRING_LABEL_TOO_LONG |
            RECURRING_INVALID_AMOUNT | RECURRING_INVALID_FREQUENCY |
            RECURRING_INVALID_DATE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: RECURRING_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Recurring]
      summary: Delete a reminder
      description: Removes it from the list. Nothing is cancelled with any company or person.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Reminder deleted
        '404':
          description: RECURRING_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/recurring/{id}/toggle:
    post:
      tags: [Recurring]
      summary: Pause or resume a reminder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
