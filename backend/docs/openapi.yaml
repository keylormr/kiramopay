      description: >-
        The person's plan limits how many goals they can have at once (by
        default free 3, plus 10, pro without limit; the numbers in force are
        published in /api/v1/transparency/fees). The limit only stops
        creating: whoever already has more keeps every goal. Two simultaneous
        creations cannot both slip past the limit. Money kept in a goal earns
        nothing.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
