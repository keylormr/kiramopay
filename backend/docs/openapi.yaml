      responses:
        '201':
          description: Reward redeemed; `cashback_minor` is what reached the wallet.
        '409':
          description: >-
            `LOYALTY_SIN_FONDOS` (the promotions fund cannot cover it),
            `LOYALTY_SIN_ENTREGA` (the reward has no way to be delivered) or
            `LOYALTY_SIN_EXISTENCIAS` (out of stock).

