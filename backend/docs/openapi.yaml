          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/budgets/{id}:
    patch:
      tags: [Budgets]
      summary: Change a budget or write down how much was spent
      description: >-
        Only the fields sent change. amount_spent replaces the stored value (it
        is the total the person has written down, not an increment).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetUpdateRequest'
      responses:
        '200':
          description: Budget updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: boolean }
        '400':
          description: >-
            INVALID_BODY | BUDGET_LABEL_REQUIRED | BUDGET_LABEL_TOO_LONG |
            BUDGET_INVALID_LIMIT | BUDGET_INVALID_SPENT (negative amount_spent) |
            BUDGET_INVALID_FIELD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: BUDGET_NOT_FOUND (it does not exist or belongs to someone else)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
