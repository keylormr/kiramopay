  # ── Admin: merchants (verification and plan) ──────────────────────
  /api/v1/admin/merchants/{id}/approve:
    post:
      tags: [Admin]
      summary: Approve a merchant's verification (admin)
      description: >-
        Sets verification_status=verified. The FIRST approval of a merchant
        grants the entry promotion: promo_hasta = approval + 3 months, during
        which the commission charged is the lower of commission_bps and 25
        bps. Approving again (after a rejection, or after the owner changed
        the legal identity and the merchant went back to pending) neither
        renews nor extends it, and approving a merchant that is already
        verified never grants it. A merchant approved before the promotion
        existed does not receive it; migration 068 documents the one case
        the stored data cannot recognize.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Approved merchant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400':
          description: APPROVE_FAILED
        '403':
          description: FORBIDDEN (not an administrator)

  /api/v1/admin/merchants/{id}/plan:
    patch:
      tags: [Admin]
      summary: Assign a merchant's plan by hand (admin)
      description: >-
        base or analitica. There is no charging for plans yet: this is how a
        pilot merchant gets the report comparison and the CSV export, and it
        charges nothing. Validation is strict: the body must be exactly one
        plan field. Audited as admin_merchant_plan_set (high) with
        plan_anterior and plan_nuevo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPlanComercioRequest'
      responses:
        '200':
          description: Merchant with its new plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400':
          description: INVALID_ID | INVALID_BODY (anything but exactly one plan field) | PLAN_INVALID (not base or analitica, written exactly so)
        '403':
          description: FORBIDDEN (not an administrator)
        '404':
          description: MERCHANT_NOT_FOUND
        '500':
          description: PLAN_UPDATE_FAILED

  # ── Admin: user management (remote block) ─────────────────────────
  /api/v1/admin/users/search:
    post:
      tags: [Admin]
      summary: Search accounts by cedula, phone, email or partial name (admin)
      description: >-
        A term that parses as a cedula, phone or email is looked up EXACTLY
        (by its searchable hash); anything else matches the full name
        case-insensitively. PII comes back masked. The term travels in the
        body, never in the URL (it would end up in proxy and provider logs).
        Rate limited to 30/min per administrator; every search is audited by
        kind, never by term.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q]
              properties:
                q:
                  type: string
                  minLength: 3
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 20
      responses:
        '200':
          description: Matching accounts (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '400':
          description: SEARCH_TERM_TOO_SHORT (fewer than 3 characters)
        '403':
          description: FORBIDDEN (not an administrator)
        '429':
          description: RATE_LIMITED

  /api/v1/admin/users/blocked:
    get:
      tags: [Admin]
      summary: List blocked accounts, most recent first (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Blocked accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '403':
          description: FORBIDDEN (not an administrator)

  /api/v1/admin/users/{id}:
    get:
      tags: [Admin]
      summary: Get one account's administrative card (admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Account card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          description: INVALID_ID (id is not a UUID)
        '403':
          description: FORBIDDEN (not an administrator)
        '404':
          description: USER_NOT_FOUND

  /api/v1/admin/users/{id}/block:
    post:
      tags: [Admin]
      summary: Block an account and revoke all its sessions (admin)
      description: >-
        Sets status=blocked, revokes every session and refresh token, and marks
        the account so any further authenticated request answers 403
        ACCOUNT_BLOCKED. Idempotent. Audited as user_blocked (critical) with
        the reason and the number of sessions revoked.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminBlockRequest'
      responses:
        '200':
          description: Account blocked (fresh card)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          description: INVALID_ID | REASON_REQUIRED (empty or over 500 chars) | CANNOT_BLOCK_SELF | CANNOT_BLOCK_ADMIN
        '403':
          description: FORBIDDEN (not an administrator)
        '404':
          description: USER_NOT_FOUND
        '500':
          description: BLOCK_FAILED

  /api/v1/admin/users/{id}/unblock:
    post:
      tags: [Admin]
      summary: Unblock an account (admin)
      description: >-
        Sets status=active and clears the block trail. Revoked sessions are NOT
        restored; the person signs in again with their password. Idempotent.
        Audited as user_unblocked (high).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Account unblocked (fresh card)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          description: INVALID_ID (id is not a UUID)
        '403':
          description: FORBIDDEN (not an administrator)
        '404':
          description: USER_NOT_FOUND
        '500':
          description: UNBLOCK_FAILED

  /api/v1/admin/users/{id}/expiry:
    post:
      tags: [Admin]
      summary: Schedule or clear an account expiry (admin)
      description: >-
        Sets users.expires_at, the moment from which a periodic sweep blocks the
        account with reason "demo vencido" — same path as a manual block, so the
        session revocation, the ACCOUNT_BLOCKED mark and the WebSocket cut are
        identical. Setting it does NOT block anything by itself; a date already
        in the past is legitimate and means "close it on the next tick".
        Unblocking an account by hand clears an expiry that already fired, so
        the sweep does not undo the administrator's decision. Audited as
        user_expiry_set (high).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminExpiryRequest'
      responses:
        '200':
          description: Expiry scheduled or cleared (fresh card)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          description: INVALID_ID | INVALID_BODY | EXPIRY_REQUIRED | INVALID_EXPIRY (not RFC3339) | CANNOT_EXPIRE_ADMIN
        '403':
          description: FORBIDDEN (not an administrator)
        '404':
          description: USER_NOT_FOUND
        '500':
          description: EXPIRY_FAILED

  /api/v1/admin/users/{id}/plan:
    patch:
      tags: [Admin]
      summary: Assign a person's plan by hand (admin)
      description: >-
        free, plus or pro. There is no charging for plans yet: this is how a
        pilot account gets plus or pro, and it charges nothing. Lowering the
        plan removes nothing: the limits only stop creating new goals and
        cards. Validation is strict: the body must be exactly one plan field.
        Shares the 30/min per-administrator budget with the rest of account
        management. Audited as admin_user_plan_set (high) with plan_anterior
        and plan_nuevo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPlanPersonalRequest'
      responses:
        '200':
          description: Plan assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanAsignado'
        '400':
          description: INVALID_ID | INVALID_BODY (anything but exactly one plan field) | PLAN_INVALID (not free, plus or pro, written exactly so)
        '403':
          description: FORBIDDEN (not an administrator)
        '404':
          description: USER_NOT_FOUND
        '429':
          description: RATE_LIMITED
        '500':
          description: PLAN_UPDATE_FAILED

  # ── Admin: sessions of one account  ───────────────────────────────
  /api/v1/admin/users/{id}/sessions:
    get:
      tags: [Admin]
      summary: List the devices with an open session on one account (admin)
      description: >-
        The same view the person gets of their own devices, with one
        difference: no session comes back marked `current`, because the
        administrator is not that person. Shares the 30/min per-administrator
        budget with the rest of account management.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Open sessions (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '400':
          description: INVALID_ID (id is not a UUID)
        '403':
          description: FORBIDDEN (not an administrator)
        '404':
          description: USER_NOT_FOUND
        '429':
          description: RATE_LIMITED
        '500':
          description: SESSIONS_FAILED

  /api/v1/admin/users/{id}/sessions/{sid}/revoke:
    post:
      tags: [Admin]
      summary: Close one device of an account (admin)
      description: >-
        Closes a single session of somebody else's account and revokes its
        refresh family in the same transaction — without the family the device
        renews inside fifteen minutes and comes back. The account is NOT
        blocked and its other devices stay signed in. It also cuts that
        person's WebSocket connections: the hub identifies connections by user
        and not by session, so all of them drop; the devices that are still
        valid reconnect on their own with their tokens, and the one just closed
        is the only one that cannot. Audited as admin_session_revoked (high).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: sid
          in: path
          required: true
          description: Session to close, as returned by GET /api/v1/admin/users/{id}/sessions
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                    description: Always true; a session that was not closed answers 404
        '400':
          description: INVALID_ID (id or sid is not a UUID)
        '403':
          description: FORBIDDEN (not an administrator)
        '404':
          description: SESSION_NOT_FOUND (unknown, already closed, or another account's)
        '429':
          description: RATE_LIMITED
        '500':
          description: REVOKE_FAILED

  /api/v1/admin/users/{id}/sessions/revoke-all:
    post:
      tags: [Admin]
      summary: Close every device of an account without blocking it (admin)
      description: >-
        Closes every session of the account, revokes all of its refresh
        families and cuts its WebSocket connections. The account is NOT
        blocked: the person signs in again with their password and gets a fresh
        session. That is the difference with /block, and it is what a suspected
        device — rather than a suspected person — calls for. Audited as
        admin_sessions_revoked_all (critical) with the number of sessions
        closed.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Sessions closed (0 when the account had none open)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsRevoked'
        '400':
          description: INVALID_ID (id is not a UUID)
        '403':
          description: FORBIDDEN (not an administrator)
        '404':
          description: USER_NOT_FOUND
        '429':
          description: RATE_LIMITED
        '500':
          description: REVOKE_FAILED

  # ── Admin: paid plan waiting list ─────────────────────────────────
  /api/v1/admin/plans/interest:
    get:
      tags: [Admin]
      summary: List who registered interest in a paid plan (admin)
      description: >-
        Most recent first. PII comes back masked in SQL, exactly as in the
        account cards: cedula keeps its last 3 digits, phone its last 4, email
        its first letter and domain.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 200
      responses:
        '200':
          description: Registered interest (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanInterestAdmin'
        '403':
          description: FORBIDDEN (not an administrator)
        '500':
          description: FETCH_FAILED

  # ── Push Notifications (Phase 9) ──────────────────────────────────
  /api/v1/push/public-key:
    get:
      tags: [Notifications]
      summary: VAPID public key for Web Push
      description: >-
        The key the browser needs to subscribe. habilitado is false when the
        server has no VAPID key pair configured; the app then does not offer
        system alerts.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The public key and whether Web Push is enabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [public_key, habilitado]
                    properties:
                      public_key: { type: string, description: 'Base64url, empty when not configured' }
                      habilitado: { type: boolean }
        '401':
          description: Unauthorized

  /api/v1/push/subscribe:
    post:
      tags: [Notifications]
      summary: Register push subscription
      description: >-
        Register a Web Push subscription for the authenticated user. Accepts the
        browser shape (PushSubscription.toJSON(), keys nested under `keys`) and
        the flat shape (`auth` and `p256dh` at the top level). The endpoint must
        be a public https push service. Re-registering an endpoint binds it to
        the caller.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: string
                  format: uri
                keys:
                  type: object
                  properties:
                    p256dh:
                      type: string
                    auth:
                      type: string
                p256dh:
                  type: string
                auth:
                  type: string
      responses:
        '201':
          description: Subscription registered
        '400':
          description: >-
            INVALID_BODY, MISSING_KEYS (endpoint, auth or p256dh missing) or
            INVALID_ENDPOINT (not a public https push service)
        '401':
          description: Unauthorized

  /api/v1/push/unsubscribe:
    post:
      tags: [Notifications]
      summary: Remove push subscription
      description: Same as the DELETE form, for clients that cannot send a body with DELETE.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: string
                  format: uri
      responses:
        '204':
          description: Subscription removed
        '400':
          description: MISSING_ENDPOINT
        '401':
          description: Unauthorized
    delete:
      tags: [Notifications]
      summary: Remove push subscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: string
                  format: uri
      responses:
        '204':
          description: Subscription removed
        '400':
          description: MISSING_ENDPOINT
        '401':
          description: Unauthorized

  /api/v1/push/nativo:
    get:
      tags: [Notifications]
      summary: Whether native push (FCM) is enabled
      description: >-
        habilitado is false when the server has no FCM service account
        (FCM_SERVICE_ACCOUNT_JSON); the installed app then does not offer
        system alerts.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Native push availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    required: [habilitado]
                    properties:
                      habilitado: { type: boolean }
        '401':
          description: Unauthorized

  /api/v1/push/dispositivos:
    post:
      tags: [Notifications]
      summary: Register this phone for native push
      description: >-
        Stores the FCM registration token of the installed app for the caller.
        A token already registered by another account moves to the caller.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 4096 }
                plataforma: { type: string, enum: [android], default: android }
      responses:
        '201':
          description: Device registered
        '400':
          description: INVALID_BODY, INVALID_TOKEN or INVALID_PLATFORM
        '401':
          description: Unauthorized
        '409':
          description: NATIVE_PUSH_DISABLED (the server has no FCM service account)

  /api/v1/push/dispositivos/baja:
    post:
      tags: [Notifications]
      summary: Unregister this phone from native push
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '204':
          description: Device removed
        '400':
          description: INVALID_TOKEN
        '401':
          description: Unauthorized

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: List notification history
      description: Returns paginated notification history for the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    nullable: true
                    items: { $ref: '#/components/schemas/NotificationRecord' }
        '401':
          description: Unauthorized

  /api/v1/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark notification as read
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Notification marked as read
        '401':
          description: Unauthorized

  /api/v1/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all of the caller's notifications as read
      security:
        - bearerAuth: []
      responses:
        '204':
          description: All notifications marked as read
        '401':
          description: Unauthorized

  # ── MFA: TOTP authenticator ───────────────────────────────────────
  /api/v1/mfa/totp/status:
    get:
      tags: [MFA]
      summary: Whether the caller has an active authenticator enrollment
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '{ enabled: boolean }'

  /api/v1/mfa/totp/enroll:
    post:
      tags: [MFA]
      summary: Start TOTP enrollment (returns secret + otpauth URL for QR)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: '{ secret, otpauth_url } — shown once'

  /api/v1/mfa/totp/confirm:
    post:
      tags: [MFA]
      summary: Confirm the first code; activates 2FA and returns recovery codes
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
      responses:
        '200':
          description: '{ status: enabled, recovery_codes: [...] } — shown once'

  /api/v1/mfa/totp/verify:
    post:
      tags: [MFA]
      summary: Verify a TOTP or recovery code (records a verified MFA challenge)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                purpose: { type: string, default: high_value_tx }
      responses:
        '200':
          description: Verified

  /api/v1/mfa/totp/disable:
    post:
      tags: [MFA]
      summary: Disable 2FA after re-verifying a current code
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
      responses:
        '200':
          description: Disabled

  # ── Escrow ────────────────────────────────────────────────────────
  /api/v1/escrow:
    post:
      tags: [Escrow]
      summary: Create a pending escrow agreement (caller = buyer; no money moves)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscrowCreateRequest'
      responses:
        '201':
          description: Agreement created (status pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowAgreement'
        '400':
          description: >-
            ESCROW_SELF (the seller is the caller), ESCROW_INVALID_AMOUNT
            (amount_minor <= 0), ESCROW_DESCRIPTION_REQUIRED (blank
            description), INVALID_REQUEST (any other malformed input: missing
            or malformed seller, unsupported currency) or INVALID_BODY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: ESCROW_SELLER_NOT_FOUND — the seller has no KiramoPay account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Escrow]
      summary: List the caller's agreements (as buyer or seller)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Agreement list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EscrowAgreement'

  /api/v1/escrow/{id}:
    get:
      tags: [Escrow]
      summary: Get one agreement (parties only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Agreement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowAgreement'
        '403':
          description: Not a party to this agreement

  /api/v1/escrow/{id}/fund:
    post:
      tags: [Escrow]
      summary: Fund the agreement (buyer only; debits buyer → SYSTEM:ESCROW; MFA ≥100K CRC)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Funded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowAgreement'
        '403':
          description: Buyer only / MFA required
        '409':
          description: Not in a fundable state
        '422':
          description: Insufficient balance

  /api/v1/escrow/{id}/deliver:
    post:
      tags: [Escrow]
      summary: Mark the goods or service as delivered (seller only)
      description: >-
        Starts the buyer's review period (`review_by`). Until the seller marks
        delivery, a funded agreement runs against `deliver_by`, and if that
        passes the money goes back to the buyer. After it, if `review_by`
        passes without the buyer releasing or disputing, the money goes to
        the seller. Whoever had to act and did not, loses. Only once per
        agreement, and only while it is funded.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Delivery recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowAgreement'
        '409':
          description: Not funded, or delivery already marked.

  /api/v1/escrow/{id}/release:
    post:
      tags: [Escrow]
      summary: Release held funds to the seller (buyer only)
      description: >-
        Works from `funded` and, as a concession, from `disputed`: the buyer
        can settle a dispute in the seller's favour without waiting for the
        arbiter.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowAgreement'

  /api/v1/escrow/{id}/refund:
    post:
      tags: [Escrow]
      summary: Return held funds to the buyer (seller only)
      description: >-
        Works from `funded` and, as a concession, from `disputed`: the seller
        can settle a dispute in the buyer's favour without waiting for the
        arbiter.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Refunded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowAgreement'

  /api/v1/escrow/{id}/dispute:
    post:
      tags: [Escrow]
      summary: Freeze a funded agreement pending admin resolution (either party)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Disputed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowAgreement'

  /api/v1/escrow/{id}/cancel:
    post:
      tags: [Escrow]
      summary: Cancel a pending (unfunded) agreement (either party)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowAgreement'

  /api/v1/admin/promociones:
    get:
      tags: [Admin]
      summary: Balance of the promotions fund that pays point cashback
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The fund balance.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saldo_minor: { type: integer, format: int64 }
                  moneda: { type: string, example: CRC }

  /api/v1/admin/promociones/fondos:
    post:
      tags: [Admin]
      summary: Record a company deposit into the promotions fund
      description: >-
        Posts debit SYSTEM:RESERVE:CRC / credit SYSTEM:PROMOTIONS:CRC. This
        RAISES THE PUBLISHED RESERVES in the proof-of-reserves, so it must match
        a real deposit: a reference (transfer or receipt number) is mandatory
        and the funding is audited with high risk. The idempotency key makes a
        double tap fund once.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor, referencia, idempotency_key]
              properties:
                amount_minor: { type: integer, format: int64, minimum: 1 }
                referencia: { type: string, minLength: 3 }
                idempotency_key: { type: string }
      responses:
        '200':
          description: The fund balance after the deposit.
        '400':
          description: Missing amount, reference or idempotency key.

  /api/v1/admin/escrow:
    get:
      tags: [Admin]
      summary: The escrow dispute queue (admin)
      description: >-
        Without `status` this returns ONLY disputed agreements — the queue that
        has to be worked — and the applied status travels back in the response
        so a short list is never mistaken for "there are only three agreements
        in the whole system". `status=all` returns the full history; any
        concrete status narrows to it, and an unknown value is rejected with
        400 rather than answering with an empty list. Ordered oldest dispute
        first, because that is what measures how long someone's money has been
        frozen. The parties are identified by id; `GET /api/v1/admin/users/{id}`
        puts names on them.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, funded, released, refunded, disputed, cancelled, all]
          description: Defaults to `disputed`.
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: One page of the queue, plus the size of the whole queue.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agreements:
                    type: array
                    items:
                      $ref: '#/components/schemas/EscrowAgreement'
                  total: { type: integer }
                  status: { type: string }
                  limit: { type: integer }
                  offset: { type: integer }

  /api/v1/admin/escrow/{id}:
    get:
      tags: [Admin]
      summary: Read any agreement (admin, no party check)
      description: >-
        The user-facing `GET /api/v1/escrow/{id}` is scoped to the parties of
        the agreement, so whoever has to arbitrate a dispute got a 403 on the
        very case they are meant to resolve.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The agreement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowAgreement'

  /api/v1/admin/escrow/{id}/resolve:
    post:
      tags: [Admin]
      summary: Resolve a disputed agreement (admin; outcome released|refunded)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome: { type: string, enum: [released, refunded] }
      responses:
        '200':
          description: Resolved

  # ── Payouts (JWT-authenticated) ────────────────────────────────────
  /api/v1/payouts/rails:
    get:
      tags: [Payouts]
      summary: List the available settlement rails
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '{ rails: [string] }'

  /api/v1/payouts:
    post:
      tags: [Payouts]
      summary: >-
        Create and submit a payout (debits the caller → SYSTEM:EXTERNAL:<RAIL>;
        idempotent on idempotency_key; MFA ≥100K CRC). The response status is
        the terminal/interim state — completed, processing (settling), or failed
        (funds already refunded).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutCreateRequest'
      responses:
        '201':
          description: Payout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '400':
          description: Invalid request / unknown rail
        '403':
          description: MFA required
        '422':
          description: Insufficient balance
    get:
      tags: [Payouts]
      summary: List the caller's payouts
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Payout list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payout'

  /api/v1/payouts/{id}:
    get:
      tags: [Payouts]
      summary: Get one payout (owner only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Payout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'
        '403':
          description: Not the owner

  /api/v1/payouts/{id}/refresh:
    post:
      tags: [Payouts]
      summary: >-
        Reconcile a processing payout against its rail (resolve an async
        settlement to completed/failed). No-op for terminal payouts.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Current payout state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payout'

  # ── Assistant (JWT-authenticated, read-only) ───────────────────────
  /api/v1/assistant/status:
    get:
      tags: [Assistant]
      summary: Whether the assistant is configured (GEMINI_API_KEY present)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: '{ available: boolean }'

  /api/v1/assistant/chat:
    post:
      tags: [Assistant]
      summary: >-
        Ask the assistant about your own data. The model runs server-side with
        read-only tools (balance, transactions, budgets) and cannot move money.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantChatRequest'
      responses:
        '200':
          description: Assistant reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantChatResponse'
        '400':
          description: Empty or oversized message
        '502':
          description: Upstream model error
        '503':
          description: Assistant not configured

  # ── B2B platform management (JWT-authenticated) ────────────────────
  /api/v1/b2b/keys:
    post:
      tags: [B2B]
      summary: Create an API key (full key returned ONCE)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                scopes: { type: string, description: 'comma-separated; empty = all (escrow:read,escrow:write,payout:read,payout:write)' }
      responses:
        '201':
          description: '{ key, full } — store `full` now, it is never shown again'
    get:
      tags: [B2B]
      summary: List the caller's API keys (prefixes only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Key list

  /api/v1/b2b/keys/{id}:
    delete:
      tags: [B2B]
      summary: Revoke an API key
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Revoked

  /api/v1/b2b/webhooks:
    post:
      tags: [B2B]
      summary: Register a webhook endpoint (signing secret returned at creation)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                events: { type: string, description: 'comma-separated event list, or * (default)' }
      responses:
        '201':
          description: '{ endpoint, secret }'
        '400':
          description: >-
            WEBHOOK_INVALID_URL (the url is not a full http(s) address of a
            public server: missing scheme or host, another scheme, embedded
            credentials, or a loopback/private/link-local destination) or
            INVALID_BODY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [B2B]
      summary: List webhook endpoints
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Endpoint list

  /api/v1/b2b/webhooks/{id}:
    delete:
      tags: [B2B]
      summary: Delete a webhook endpoint
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Deleted

  /api/v1/b2b/webhooks/{id}/deliveries:
    get:
      tags: [B2B]
      summary: Recent deliveries for an endpoint (debugging)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Delivery list with status/attempts/response codes

  # ── Merchant API (API-key-authenticated) ────────────────────────────
  # Same escrow operations as /api/v1/escrow but authenticated with an API
  # key (Authorization: Bearer kp_live_… or X-API-Key) and gated by the
  # key's scopes: GETs need escrow:read, POSTs escrow:write.
  /api/b2b/v1/ping:
    get:
      tags: [B2B]
      summary: Verify an API key works
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: '{ status: ok, merchant_id }'

  /api/b2b/v1/escrow:
    post:
      tags: [B2B]
      summary: Create an escrow agreement programmatically (scope escrow:write)
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscrowCreateRequest'
      responses:
        '201':
          description: Agreement created
        '403':
          description: Key lacks escrow:write
    get:
      tags: [B2B]
      summary: List the merchant's agreements (scope escrow:read)
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Agreement list

  /api/b2b/v1/payouts:
    post:
      tags: [B2B]
      summary: Create a payout programmatically (scope payout:write)
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutCreateRequest'
      responses:
        '201':
          description: Payout created
        '403':
          description: Key lacks payout:write
    get:
      tags: [B2B]
      summary: List the merchant's payouts (scope payout:read)
      security:
        - apiKeyAuth: []
      responses:
        '200':
          description: Payout list

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Merchant API key (kp_live_…); also accepted as `Authorization Bearer`

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0

  responses:
    Success:
      description: Operation successful
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF validation failed or origin not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Locked:
      description: Account locked after too many failed login attempts (5 attempts, 15 min lockout)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Request body exceeds 1MB limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AccountBlocked:
      description: >-
        Account blocked by an administrator (code ACCOUNT_BLOCKED). Returned by
        login (only after the password was verified), refresh and every
        authenticated route. The reason is never disclosed to the client.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    AdminUser:
      type: object
      description: >-
        Administrative card of an account. PII is masked in SQL: cedula keeps
        its last 3 digits, phone its last 4, email its first letter and domain.
      properties:
        id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        cedula_masked: { type: string, example: "••••••930" }
        phone_masked: { type: string, example: "••••••••1234" }
        email_masked: { type: string, example: "k•••••@gmail.com" }
        status: { type: string, enum: [active, blocked, suspended, closed] }
        role: { type: string, enum: [user, admin, support] }
        kyc_level: { type: integer }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
        blocked_at: { type: string, format: date-time, nullable: true }
        blocked_reason: { type: string, description: Empty unless blocked }
        blocked_by_name: { type: string, description: Full name of the administrator who blocked the account; empty unless blocked }
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            Scheduled expiry. When it passes, a periodic sweep blocks the
            account with reason "demo vencido". Null means the account never
            expires, which is the case for almost every account.
        plan:
          type: string
          enum: [free, plus, pro]
          description: Personal plan. While there is no charging only an administrator changes it.

    PlanInterestRequest:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [plus, pro, analitica]
          description: >-
            Plan the person wants: plus or pro (personal) or analitica
            (merchant analytics). The free plan is not registered: there is
            nothing to contract. The retired negocio and cima are rejected.

    PlanInterest:
      type: object
      description: Interest registered. Not a subscription — nothing was charged.
      properties:
        plan: { type: string, enum: [plus, pro, analitica] }
        registered_at: { type: string, format: date-time }

    PlanLimitError:
      type: object
      description: >-
        409 answer when creating a savings goal or a virtual card would go
        past the limit of the person's plan. The limit only stops CREATING:
        whoever already has more than the plan allows keeps everything, which
        is why actuales can be above limite.
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, enum: [SAVINGS_GOAL_LIMIT, CARD_LIMIT] }
            message: { type: string }
            details:
              type: object
              additionalProperties: false
              required: [plan, limite, actuales]
              properties:
                plan: { type: string, enum: [free, plus, pro] }
                limite:
                  type: integer
                  minimum: 1
                  description: How many the plan allows (goals; cards active or frozen)
                actuales:
                  type: integer
                  minimum: 0
                  description: How many the person has now

    PlanRequiredError:
      type: object
      description: 403 answer when the merchant lacks the plan a feature needs.
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, enum: [PLAN_REQUIRED] }
            message: { type: string }
            details:
              type: object
              additionalProperties: false
              required: [plan_requerido]
              properties:
                plan_requerido: { type: string, enum: [analitica] }

    AdminPlanPersonalRequest:
      type: object
      additionalProperties: false
      required: [plan]
      properties:
        plan: { type: string, enum: [free, plus, pro] }

    AdminPlanComercioRequest:
      type: object
      additionalProperties: false
      required: [plan]
      properties:
        plan: { type: string, enum: [base, analitica] }

    PlanAsignado:
      type: object
      description: A personal plan assigned by an administrator. Nothing was charged.
      additionalProperties: false
      required: [user_id, plan, plan_anterior, updated_at]
      properties:
        user_id: { type: string, format: uuid }
        plan: { type: string, enum: [free, plus, pro] }
        plan_anterior: { type: string, enum: [free, plus, pro] }
        updated_at: { type: string, format: date-time }

    Merchant:
      type: object
      additionalProperties: false
      required: [id, user_id, name, verification_status, commission_bps, comision_efectiva_bps, promo_hasta, plan, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        logo_url: { type: string }
        qr_code: { type: string }
        active: { type: boolean }
        cedula: { type: string }
        cedula_type: { type: string, enum: [fisica, juridica] }
        legal_name: { type: string }
        verification_status: { type: string, enum: [pending, verified, rejected] }
        rejection_reason: { type: string }
        reviewed_at: { type: string, format: date-time }
        commission_bps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Commission the platform set, in basis points (50 = 0.5%)
        comision_efectiva_bps:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            Commission charged on a payment made now, in basis points: the
            lower of commission_bps and 25 while promo_hasta is in the future,
            commission_bps afterwards.
        promo_hasta:
          type: string
          format: date-time
          nullable: true
          description: End of the entry promotion. Null when the merchant never had it.
        plan:
          type: string
          enum: [base, analitica]
          description: analitica adds the report comparison and the CSV export.
        created_at: { type: string, format: date-time }
        role:
          type: string
          enum: [owner, manager, cashier]
          description: How the requesting user relates to the merchant (only in the user's own list)

    ReportBucket:
      type: object
      additionalProperties: false
      required: [gross, fee, net, count]
      properties:
        key: { type: string, description: 'Location or collector id; absent for the unattributed bucket' }
        label: { type: string }
        gross: { type: integer, format: int64, description: centimos charged to payers }
        fee: { type: integer, format: int64, description: centimos of commission }
        net: { type: integer, format: int64, description: gross - fee }
        count: { type: integer }

    ReportDay:
      type: object
      additionalProperties: false
      required: [date, gross, fee, net, count]
      properties:
        date: { type: string, format: date }
        gross: { type: integer, format: int64 }
        fee: { type: integer, format: int64 }
        net: { type: integer, format: int64 }
        count: { type: integer }

    ReportDelta:
      type: object
      description: Current minus previous. Percentages are null when the previous value is 0.
      additionalProperties: false
      required: [gross, fee, net, count, gross_pct, net_pct, count_pct]
      properties:
        gross: { type: integer, format: int64 }
        fee: { type: integer, format: int64 }
        net: { type: integer, format: int64 }
        count: { type: integer }
        gross_pct: { type: number, nullable: true }
        net_pct: { type: number, nullable: true }
        count_pct: { type: number, nullable: true }

    ReportComparison:
      type: object
      additionalProperties: false
      required: [previous_from, previous_to, previous_totals, delta]
      properties:
        previous_from: { type: string, format: date }
        previous_to: { type: string, format: date }
        previous_totals: { $ref: '#/components/schemas/ReportBucket' }
        delta: { $ref: '#/components/schemas/ReportDelta' }

    MerchantReport:
      type: object
      additionalProperties: false
      required: [days, from, to, totals, daily, by_location, by_collector, plan]
      properties:
        days: { type: integer, minimum: 1, maximum: 365 }
        from: { type: string, format: date }
        to: { type: string, format: date }
        totals: { $ref: '#/components/schemas/ReportBucket' }
        daily:
          type: array
          items: { $ref: '#/components/schemas/ReportDay' }
        by_location:
          type: array
          items: { $ref: '#/components/schemas/ReportBucket' }
        by_collector:
          type: array
          items: { $ref: '#/components/schemas/ReportBucket' }
        plan: { type: string, enum: [base, analitica] }
        comparison: { $ref: '#/components/schemas/ReportComparison' }

    SavingsGoal:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string }
        target_minor: { type: integer, format: int64, description: centimos }
        saved_minor: { type: integer, format: int64, description: centimos }
        currency: { type: string, enum: [CRC, USD] }
        icon: { type: string }
        color: { type: string }
        created_at: { type: string, format: date-time }

    SavingsGoalCreateRequest:
      type: object
      required: [name, target_minor]
      properties:
        name: { type: string, maxLength: 120 }
        target_minor: { type: integer, format: int64, minimum: 1, description: centimos }
        currency: { type: string, enum: [CRC, USD], default: CRC }
        icon: { type: string, maxLength: 40 }
        color: { type: string, maxLength: 20 }

    Budget:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        label: { type: string }
        amount_limit: { type: integer, format: int64, description: centimos }
        amount_spent:
          type: integer
          format: int64
          description: centimos; written by the person, never by a ledger movement
        currency: { type: string }
        icon: { type: string }
        color: { type: string }
        period: { type: string, example: monthly }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BudgetCreateRequest:
      type: object
      required: [label, amount_limit]
      properties:
        label: { type: string, maxLength: 100 }
        amount_limit: { type: integer, format: int64, minimum: 1, description: centimos }
        currency: { type: string, enum: [CRC, USD], default: CRC }
        icon: { type: string, maxLength: 50 }
        color: { type: string, maxLength: 20 }
        period: { type: string, enum: [monthly], default: monthly }

    BudgetUpdateRequest:
      type: object
      properties:
        label: { type: string, maxLength: 100 }
        amount_limit: { type: integer, format: int64, minimum: 1, description: centimos }
        amount_spent: { type: integer, format: int64, minimum: 0, description: centimos (the new total) }
        icon: { type: string, maxLength: 50 }
        color: { type: string, maxLength: 20 }

    RecurringPayment:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        label: { type: string }
        type: { type: string, enum: [service, sinpe, recharge] }
        amount: { type: integer, format: int64, description: centimos }
        currency: { type: string }
        frequency: { type: string, enum: [weekly, biweekly, monthly] }
        next_date: { type: string, format: date }
        last_paid_date: { type: string, format: date }
        recipient_phone: { type: string }
        recipient_name: { type: string }
        service_provider_id: { type: string }
        client_id: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RecurringPaymentCreateRequest:
      type: object
      required: [label, type, amount, frequency, next_date]
      properties:
        label: { type: string, maxLength: 200 }
        type: { type: string, enum: [service, sinpe, recharge] }
        amount: { type: integer, format: int64, minimum: 1, description: centimos }
        currency: { type: string, enum: [CRC, USD], default: CRC }
        frequency: { type: string, enum: [weekly, biweekly, monthly] }
        next_date: { type: string, format: date }
        recipient_phone: { type: string, maxLength: 15 }
        recipient_name: { type: string, maxLength: 100 }
        service_provider_id: { type: string, maxLength: 20 }
        client_id: { type: string, maxLength: 50 }

    RecurringPaymentUpdateRequest:
      type: object
      properties:
        label: { type: string, maxLength: 200 }
        amount: { type: integer, format: int64, minimum: 1, description: centimos }
        frequency: { type: string, enum: [weekly, biweekly, monthly] }
        next_date: { type: string, format: date }

    PlanInterestAdmin:
      type: object
      description: >-
        One line of the paid plan waiting list. PII is masked in SQL, the same
        way as in AdminUser.
      properties:
        user_id: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        cedula_masked: { type: string, example: "••••••930" }
        phone_masked: { type: string, example: "••••••••1234" }
        email_masked: { type: string, example: "k•••••@gmail.com" }
        plan:
          type: string
          enum: [plus, pro, analitica, negocio, cima]
          description: negocio and cima are retired plans; their rows are kept, not deleted.
        registered_at: { type: string, format: date-time }

    AdminExpiryRequest:
      type: object
      required: [expires_at]
      properties:
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            RFC3339 moment from which the sweep blocks the account, or null to
            clear the expiry. The key must always be present: an empty body is
            rejected with EXPIRY_REQUIRED, not read as "clear it".

    AdminBlockRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Free text kept in the audit trail (never PII)

    Session:
      type: object
      description: >-
        One open session, which is to say one device signed in to the account.
        It carries no token and no hash: only what is needed to recognise the
        device and decide whether to close it.
      properties:
        id: { type: string, format: uuid }
        device_name:
          type: string
          description: >-
            The User-Agent the session was opened with, or "Dispositivo
            desconocido" when the device did not send one.
          example: "Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36"
        ip_masked:
          type: string
          description: >-
            The address the session was opened from, cut to its /16 network:
            enough to tell one place from another without returning a full
            personal address. Empty when it was not recorded.
          example: "190.7.0.0"
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        current:
          type: boolean
          description: >-
            True for the session the request came from, matched by the access
            token's jti. Always false when an administrator is the one asking:
            the administrator is not that person.

    SessionsRevoked:
      type: object
      description: >-
        How many sessions were closed. Each one took its refresh family with
        it, so none of those devices can renew back in.
      properties:
        revoked: { type: integer, example: 3 }

    EscrowCreateRequest:
      type: object
      required: [amount_minor, description]
      description: >-
        The seller is identified by `seller_phone` OR `seller_id` — exactly one
        is needed. The app sends the phone, because no screen in the app shows
        anyone's UUID; `seller_id` stays for the B2B clients that already
        integrated against this route. Either way the account must EXIST: an
        agreement pointing at nobody can still be funded (the money leaves the
        buyer's wallet into SYSTEM:ESCROW) and can never be released to anyone.
        A number with no account is rejected with 422 `ESCROW_SELLER_NOT_FOUND`.
      properties:
        seller_phone:
          type: string
          description: Seller's phone; the server resolves it to a real account.
          example: '+50688885678'
        seller_id: { type: string, format: uuid }
        amount_minor: { type: integer, format: int64, description: amount in centimos/cents }
        currency: { type: string, enum: [CRC, USD], default: CRC }
        description: { type: string }

    EscrowAgreement:
      type: object
      properties:
        id: { type: string, format: uuid }
        buyer_id: { type: string, format: uuid }
        seller_id: { type: string, format: uuid }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string, enum: [pending, funded, released, refunded, disputed, cancelled] }
        description: { type: string }
        dispute_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        delivered_at:
          type: string
          format: date-time
          description: When the seller marked the delivery.
        deliver_by:
          type: string
          format: date-time
          description: >-
            Deadline for the seller to mark delivery. If it passes, the money
            goes back to the buyer.
        review_by:
          type: string
          format: date-time
          description: >-
            Deadline for the buyer to release or dispute once delivery is
            marked. If it passes, the money goes to the seller.
        closed_by_expiry:
          type: string
          enum: [entrega, revision]
          description: >-
            Set when a deadline closed the agreement: `entrega` (the seller
            never marked delivery) or `revision` (the buyer neither released
            nor disputed).

    PayoutDestination:
      type: object
      required: [account, name]
      description: Rail-typed beneficiary; each rail reads the fields it needs.
      properties:
        type: { type: string, description: 'e.g. bank_account, sinpe_phone, crypto_address' }
        account: { type: string, description: account number / IBAN / phone / address }
        name: { type: string, description: beneficiary name }
        bank: { type: string }
        country: { type: string, description: ISO-3166 alpha-2 }

    PayoutCreateRequest:
      type: object
      required: [rail, amount_minor, destination, idempotency_key]
      properties:
        rail: { type: string, description: 'a registered rail name (see GET /payouts/rails)' }
        amount_minor: { type: integer, format: int64, description: amount in centimos/cents }
        currency: { type: string, enum: [CRC, USD], default: CRC }
        destination: { $ref: '#/components/schemas/PayoutDestination' }
        idempotency_key: { type: string, description: required; makes a retried POST safe }

    Payout:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        rail: { type: string }
        amount_minor: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string, enum: [pending, processing, completed, failed] }
        destination: { $ref: '#/components/schemas/PayoutDestination' }
        external_id: { type: string, description: "the rail's id, once known" }
        failure_reason: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AssistantChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, description: the user's question (1-4000 chars) }
        history:
          type: array
          description: prior turns for context (bounded server-side)
          items:
            type: object
            properties:
              role: { type: string, enum: [user, assistant] }
              text: { type: string }

    AssistantChatResponse:
      type: object
      properties:
        reply: { type: string }
        tools_used:
          type: array
          items: { type: string }
        proposals:
          type: array
          description: >-
            Prepared money actions (Phase 3b). NOT executed — the client renders a
            confirmation card; only the user's confirm calls the real gated endpoint.
          items:
            type: object
            properties:
              kind: { type: string, enum: [sinpe_transfer, bill_payment, recharge] }
              summary: { type: string }
              amount_minor: { type: integer, format: int64 }
              currency: { type: string }
              phone: { type: string }
              description: { type: string }
              provider_code: { type: string }
              provider_name: { type: string }
              client_id: { type: string }
              period: { type: string }
              operator: { type: string }

    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          $ref: '#/components/schemas/ApiError'

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          $ref: '#/components/schemas/ApiError'

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          description: >-
            Data the screen needs to explain the rejection (see PlanLimitError
            and PlanRequiredError). Only on 4xx answers; never on a 5xx.

    HealthResponse:
      type: object
      # required + additionalProperties: sin ellos el test de contrato validaba
      # cualquier cuerpo que no contradijera un tipo, asi que un campo que el
      # handler dejara de emitir (o uno nuevo sin documentar) pasaba en verde.
      additionalProperties: false
      required: [status, version, environment, services, websocket_clients, last_drift_crc, dias_de_particiones, auditoria_descartada, crypto_prices, tipo_de_cambio]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          description: >-
            Repository version this binary was built from (same value as
            package.json and the Android versionName). Use it to confirm which
            build a deploy is actually serving.
          example: "2.3.5"
        environment:
          type: string
        services:
          type: object
          properties:
            database:
              type: string
              enum: [ok, error]
            redis:
              type: string
              enum: [ok, error]
        websocket_clients:
          type: integer
        last_drift_crc:
          type: integer
          description: Residual cache-vs-journal drift (minor units) from the last reconcile.
        dias_de_particiones:
          type: integer
          description: >-
            Days of remaining coverage in the `transactions` range partitions.
            The table has no DEFAULT partition, so once coverage runs out every
            money movement fails on insert — this is the runway before that.
            A value of -1 means the runway could not be read yet.
          example: 420
        auditoria_descartada:
          type: integer
          description: >-
            Audit events dropped because the buffer was full since the process
            started. Non-zero means the audit trail has gaps.
          example: 0
        tipo_de_cambio:
          type: object
          additionalProperties: false
          required: [fuente, usd_crc, compra]
          description: >-
            Official USD/CRC reference rate (BCCR, as republished by Hacienda),
            refreshed hourly. `usd_crc` is the rate the app charges with, in
            both directions. If the source cannot confirm it for 96 hours,
            crypto quoted in colones stops trading rather than using a stale
            number; `ultimo_error` says why.
          properties:
            fuente: { type: string, example: hacienda }
            usd_crc: { type: number, example: 450.06 }
            compra: { type: number, example: 444.22 }
            fecha_fuente: { type: string, example: '2026-09-11' }
            ultima_confirmacion: { type: string, format: date-time }
            ultimo_error: { type: string }
        crypto_prices:
          type: object
          description: >-
            CoinGecko price feed state. `plan` is what the provider accepted
            for the configured key (demo, pro, none, or invalid when both hosts
            reject it); `key` is only the last 4 characters of the key.
          properties:
            plan:
              type: string
              enum: [none, demo, pro, invalid]
            key:
              type: string
            last_status:
              type: integer
            last_error:
              type: string
            last_success_at:
              type: string
            cached_assets:
              type: integer
            breaker_open:
              type: boolean
            ultima_revision_de_alertas:
              type: string
              format: date-time
              description: >-
                Last time the price-alert sweep compared active alerts against a
                live price. Absent until it has managed to compare any. A healthy
                feed with a stale value means the sweep has no fresh prices to
                work with (see ALERTAS_REFRESCO_HORAS).

    RegisterRequest:
      type: object
      required: [cedula, first_name, last_name, password, phone]
      properties:
        cedula:
          type: string
          example: "702650930"
        first_name:
          type: string
          example: "Keilor"
        last_name:
          type: string
          example: "Martinez"
        password:
          type: string
          example: "MiClave2024!"
        phone:
          type: string
          example: "+50688889999"
        email:
          type: string
          format: email
        verification_token:
          type: string
          description: Prueba de posesion del telefono/correo emitida por /auth/register/otp/verify
        referral_code:
          type: string
          pattern: '^[A-Z0-9]{8}$'
          description: Codigo de invitacion de otro usuario (opcional). Se normaliza a mayusculas; debe pertenecer a una cuenta activa o el registro responde 400 REFERRAL_CODE_INVALID.
          example: "K7PM3XQ2"

    LoginRequest:
      type: object
      description: >
        Se exige al menos uno de identifier o cedula. identifier acepta
        cedula, correo o telefono en un solo campo (el tipo se decide por
        forma); cedula queda como alias legado para clientes viejos.
      required: [password]
      properties:
        identifier:
          type: string
          description: Cedula, correo o telefono del usuario
          example: "usuario@example.com"
        cedula:
          type: string
          deprecated: true
          description: Alias legado de identifier (solo cedula)
          example: "702650930"
        password:
          type: string
          example: "MiClave2024!"

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            user:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                cedula:
                  type: string
                full_name:
                  type: string
                referral_code:
                  type: string
                  description: The new user's own invitation code (8 chars)
                plan:
                  type: string
                  enum: [free, plus, pro]
                  description: Personal plan; every account starts on free

    UserProfile:
      type: object
      description: The authenticated user's own record (GET /users/me).
      properties:
        id: { type: string, format: uuid }
        cedula: { type: string }
        phone: { type: string }
        phone_verified: { type: boolean }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        first_name: { type: string }
        last_name: { type: string }
        birth_date: { type: string, format: date-time }
        profile_picture_url: { type: string }
        biometric_enabled: { type: boolean }
        kyc_level: { type: integer }
        kyc_status: { type: string }
        status: { type: string }
        referral_code:
          type: string
          pattern: '^[A-Z0-9]{8}$'
          description: Own invitation code to share (stable, not PII)
          example: "K7PM3XQ2"
        plan:
          type: string
          enum: [free, plus, pro]
          description: >-
            Personal plan. It sets the savings goal and card limits and the
            assistant's daily questions. There is no charging yet: only an
            administrator changes it.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }

    ReferralSummary:
      type: object
      properties:
        referral_code:
          type: string
          example: "K7PM3XQ2"
        invited_count:
          type: integer
          description: Registered (non-deleted) users who signed up with this code
        points_earned:
          type: integer
          format: int64
          description: Loyalty points credited by the referral program
        bonus_points:
          type: integer
          description: Points paid per registered invitee; 0 means the program is off

    UpdateProfileRequest:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string

    CreateTransactionRequest:
      type: object
      required: [type, amount, currency]
      properties:
        type:
          type: string
          enum: [deposit, withdrawal, transfer, payment]
        amount:
          type: integer
          description: Amount in centimos
        currency:
          type: string
          default: CRC
        to_wallet_id:
          type: string
          format: uuid
        description:
          type: string

    AddSinpeContactRequest:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
        phone:
          type: string
        is_favorite:
          type: boolean

    SinpeSendRequest:
      type: object
      required: [to_phone, amount]
      properties:
        to_phone:
          type: string
        amount:
          type: integer
          description: Amount in centimos
        description:
          type: string

    SinpeSendResponse:
      type: object
      required: [transaction_id, status, amount, fee, recipient, internal]
      properties:
        transaction_id:
          type: string
        status:
          type: string
          description: >-
            "completed" for internal transfers (credited to a KiramoPay wallet),
            "pending" for external transfers awaiting inter-bank settlement.
          example: completed
        amount:
          type: integer
          description: Amount sent, in centimos
        fee:
          type: integer
          description: Fee charged, in centimos
        recipient:
          type: string
        internal:
          type: boolean
          description: >-
            True when the recipient is a KiramoPay user and the funds were
            credited to their wallet. False for external transfers, whose
            delivery to other banks is not yet enabled.

    PayBillRequest:
      type: object
      required: [provider, account_number, amount]
      properties:
        provider:
          type: string
          example: "ICE"
        account_number:
          type: string
        amount:
          type: integer

    PayBillResponse:
      type: object
      required: [transaction_id, receipt_number, provider_name, amount, status]
      properties:
        transaction_id:
          type: string
        receipt_number:
          type: string
        provider_name:
          type: string
        amount:
          type: integer
          description: Amount paid, in centimos
        status:
          type: string
          example: completed

    RechargeResponse:
      type: object
      required: [transaction_id, operator, phone, amount, status]
      properties:
        transaction_id:
          type: string
        operator:
          type: string
        phone:
          type: string
        amount:
          type: integer
          description: Amount recharged, in centimos
        status:
          type: string
          example: completed

    RechargeRequest:
      type: object
      required: [operator, phone_number, amount]
      properties:
        operator:
          type: string
          example: "Kolbi"
        phone_number:
          type: string
        amount:
          type: integer

    CryptoBuyRequest:
      type: object
      required: [asset, from_amount]
      properties:
        asset:
          type: string
          example: "BTC"
        from_amount:
          type: number
          description: Fiat to spend, in `from_currency` units (not centimos).
        from_currency:
          type: string
          enum: [CRC, USD]
          description: Defaults to CRC.
        price:
          type: number
          description: USD unit price the screen showed. Omit it to skip the 2% check.
        amount:
          type: number
          description: Ignored; the server computes the quantity. Accepted for older clients.
        idempotency_key:
          type: string

    CryptoSellRequest:
      type: object
      required: [asset, amount]
      properties:
        asset:
          type: string
          example: "BTC"
        amount:
          type: number
          description: Crypto quantity to sell, at most 18 decimals.
        to_currency:
          type: string
          enum: [CRC, USD]
          description: Defaults to CRC.
        price:
          type: number
          description: USD unit price the screen showed. Omit it to skip the 2% check.
        to_amount:
          type: number
          description: Ignored; the server computes the fiat credited. Accepted for older clients.
        idempotency_key:
          type: string

    CryptoConvertRequest:
      type: object
      required: [from_asset, to_asset, from_amount]
      properties:
        from_asset:
          type: string
          example: "BTC"
        to_asset:
          type: string
          example: "ETH"
        from_amount:
          type: number
          description: Quantity of `from_asset` to convert, at most 18 decimals.
        to_amount:
          type: number
          description: Ignored; the server computes what arrives. Accepted for older clients.
        price:
          type: number
          description: Ignored. Accepted for older clients.
        idempotency_key:
          type: string
          description: >-
            Retrying with the same key returns the recorded conversion instead
            of converting again. The key is shared with the other crypto
            movements: one already spent on a stake or a send is not a retry.

    CryptoStakeRequest:
      type: object
      required: [asset, amount]
      properties:
        asset:
          type: string
          enum: [ETH, SOL]
        amount:
          type: number
          description: Quantity to set aside, at most 18 decimals.
        apy:
          type: number
          description: Ignored; the rate is set by the server.
        locked:
          type: boolean
        lock_days:
          type: integer
        idempotency_key:
          type: string
          description: >-
            Retrying with the same key returns the position it opened instead
            of setting the asset aside again. The key is shared with the other
            crypto movements: one already spent on a conversion or a send is
            not a retry.

    CryptoSendRequest:
      type: object
      required: [asset, amount, qr_data]
      properties:
        asset:
          type: string
          example: "BTC"
        amount:
          type: number
          description: >-
            Crypto quantity the RECIPIENT gets, at most 18 decimals. The fee is
            added on top of it and paid by the sender.
        qr_data:
          type: string
          description: >-
            The QR payload exactly as the camera read it, from the recipient's
            personal code. The server resolves who owns it. There is no
            destination address and no user id: an address would have nowhere
            to go, and a hand-typed id lets someone try other people's ids
            until one lands.
          example: "KP:p:1a2b3c4d:0:CRC:iabc123"
        price:
          type: number
          description: >-
            USD unit price the screen showed. Omit it to skip the 2% check.
            Required in practice for /send, which values the send in USD for
            the spending limit and the AML monitoring.
        idempotency_key:
          type: string
          description: >-
            Ignored by /send/preview. On /send, retrying with the same key
            returns the recorded send instead of sending again. Keep the same
            key across an MFA challenge.

    CryptoSendPreview:
      type: object
      description: >-
        What the confirmation sheet shows before sending. Quantities are exact
        decimals serialized as JSON strings. The fee is KiramoPay's own, in the
        same asset and paid by the sender, so `amount` is what reaches the
        recipient and `total` is what leaves the sender's balance.
      required: [recipient_name, asset, amount, fee, total, fee_percent]
      properties:
        recipient_name:
          type: string
          description: The name of the person who owns the scanned code.
          example: "Victor Lobo"
        asset: { type: string, example: "BTC" }
        amount: { type: string, description: 'decimal, what the recipient gets' }
        fee: { type: string, description: 'decimal, KiramoPay fee in the same asset' }
        total: { type: string, description: 'decimal, amount + fee: what leaves the balance' }
        fee_percent:
          type: string
          description: >-
            decimal, the fee as a percentage, so the screen writes it once and
            it cannot drift from the rate actually charged.
          example: "0.25"

    CryptoPriceData:
      type: object
      required: [symbol, price, change_24h, volume_24h, market_cap]
      properties:
        symbol:
          type: string
          example: BTC
        price:
          type: number
          example: 68000.12
        change_24h:
          type: number
          description: 24h price change, percent
          example: 1.85
        volume_24h:
          type: number
        market_cap:
          type: number
        high_24h:
          type: number
          description: >-
            Real 24h high from the provider (CoinGecko /coins/markets).
            Omitted when the provider did not supply it — never estimated.
        low_24h:
          type: number
          description: >-
            Real 24h low from the provider (CoinGecko /coins/markets).
            Omitted when the provider did not supply it — never estimated.
        sparkline_7d:
          type: array
          items: { type: number }
          description: >-
            Approximately hourly USD prices for the last 7 days, as
            CoinGecko's sparkline_in_7d.price. Omitted (never a fabricated
            flat line or random walk) when the provider did not supply it.

    NotificationRecord:
      type: object
      required: [id, title, body, type, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        type:
          type: string
          description: Notification kind (transfer, price_alert, fraud_alert, system)
        data:
          type: object
          additionalProperties: true
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # ── Concrete DTOs surfaced by the live API ────────────────────────────
    # These mirror what handlers actually return as of 2026-05. Used to
    # generate TypeScript types in src/api/generated/. When you change a
    # handler shape, update the matching schema here and re-run gen:api.

    UserRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        cedula: { type: string }
        phone: { type: string }
        phone_verified: { type: boolean }
        email: { type: string, format: email }
        email_verified: { type: boolean }
        first_name: { type: string }
        last_name: { type: string }
        birth_date: { type: string, format: date, nullable: true }
        profile_picture_url: { type: string }
        biometric_enabled: { type: boolean }
        kyc_level: { type: integer }
        kyc_status: { type: string }
        status: { type: string }
        plan: { type: string, enum: [free, plus, pro] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }

    WalletRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        balance_crc: { type: integer, description: "Balance in CRC centimos" }
        balance_usd: { type: integer, description: "Balance in USD cents" }
        daily_limit: { type: integer }
        monthly_limit: { type: integer }
        daily_spent: { type: integer }
        monthly_spent: { type: integer }
        status: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    BalanceResponse:
      type: object
      description: Shape returned by GET /api/v1/wallets/me/balance
      properties:
        crc: { type: integer, description: "CRC centimos" }
        usd: { type: integer, description: "USD cents" }
        crc_formatted: { type: string }
        usd_formatted: { type: string }

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_at: { type: integer, description: "Unix epoch seconds (access token)" }

    LoginResponseData:
      type: object
      properties:
        user: { $ref: '#/components/schemas/UserRecord' }
        tokens: { $ref: '#/components/schemas/TokenPair' }

    SinpeContactRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        phone: { type: string }
        name: { type: string }
        bank: { type: string }
        is_favorite: { type: boolean }
        created_at: { type: string, format: date-time }

    SinpeContactConflict:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { $ref: '#/components/schemas/ApiError' }
        data: { $ref: '#/components/schemas/SinpeContactRecord' }

    SinpeHistoryRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        phone: { type: string }
        contact_name: { type: string }
        amount: { type: integer, description: "CRC centimos" }
        fee: { type: integer }
        type: { type: string, enum: [sent, received] }
        status: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }

    TransactionRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        wallet_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        type: { type: string }
        amount: { type: integer }
        currency: { type: string }
        fee: { type: integer }
        counterparty_type: { type: string }
        counterparty_name: { type: string }
        counterparty_phone: { type: string }
        status: { type: string }
        external_reference: { type: string }
        metadata: { type: string, description: "JSON-encoded extras" }
        created_at: { type: string, format: date-time }
        created_date: { type: string, format: date }

    TransactionListResponse:
      type: object
      properties:
        transactions:
          type: array
          items: { $ref: '#/components/schemas/TransactionRecord' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    TransactionSummaryGroup:
      type: object
      required: [date, type, currency, count, amount]
      properties:
        date: { type: string, format: date, description: Costa Rica calendar day }
        type: { type: string, description: Transaction type; it carries the direction }
        currency: { type: string }
        count: { type: integer, minimum: 1 }
        amount:
          type: integer
          format: int64
          minimum: 0
          description: Sum of the magnitudes, in minor units (centimos)

    TransactionSummary:
      type: object
      required: [from, to, timezone, status, groups, top, top_per_type, first_date]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date, description: Exclusive }
        timezone: { type: string, enum: [America/Costa_Rica] }
        status: { type: string, enum: [completed], description: The only status counted }
        groups:
          type: array
          items: { $ref: '#/components/schemas/TransactionSummaryGroup' }
        top:
          type: array
          description: Largest movements of each (type, currency), biggest first
          items: { $ref: '#/components/schemas/TransactionRecord' }
        top_per_type:
          type: integer
          description: How many movements `top` keeps per (type, currency)
        first_date:
          type: string
          format: date
          nullable: true
          description: >-
            Costa Rica calendar day of the user's first completed movement ever,
            or null when there is none. A previous period that starts before it
            is incomplete, so the screen does not compare against it.

    CryptoAssetRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        symbol: { type: string }
        name: { type: string }
        balance: { type: string, description: decimal }
        avg_cost:
          type: string
          description: Decimal. Average cost per unit, always in USD whatever currency the purchases were paid in.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CryptoTransactionRecord:
      type: object
      description: >-
        Quantities and prices are exact decimals serialized as JSON strings
        (for example "0.5"), never floats. For buy and sell, `id` is the id of
        the wallet transaction the ledger posting hangs from, `price` is the
        unit price in `currency`, and `total` is the fiat that moved, to the
        centimo. For convert, `asset` is "FROM→TO", `amount` is the quantity
        given, `total` the quantity received, `currency` the destination
        symbol and `price` the destination's USD unit price. For stake and
        unstake, `amount` and `total` are the quantity set aside or released,
        `currency` is the asset itself and `price` is zero: no price or fiat
        is involved. For send and receive, `amount` is the quantity that
        reached the recipient, `currency` is the asset itself, `price` its USD
        unit price, and `total` is what left the balance (`amount` plus the
        fee on the sender's row, `amount` alone on the recipient's).
        Only a send charges a fee; everywhere else `fee` is zero.
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        type: { type: string, enum: [buy, sell, convert, send, receive, stake, unstake, reward] }
        asset: { type: string }
        amount: { type: string, description: decimal }
        price: { type: string, description: decimal }
        total: { type: string, description: decimal }
        currency: { type: string }
        fee: { type: string, description: decimal }
        status: { type: string }
        created_at: { type: string, format: date-time }
        counterparty_user_id:
          type: string
          format: uuid
          description: >-
            Present only on send and receive: the other person of the transfer.
        counterparty_name:
          type: string
          description: >-
            Present only on send and receive: who it was sent to, or who it
            came from. There is no transaction hash — this crypto lives on no
            chain, so the other person is the only identity a transfer has.
          example: "Victor Lobo"

    StakingPositionRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        asset: { type: string }
        amount: { type: string, description: decimal }
        apy: { type: number }
        start_date: { type: string, format: date-time }
        locked: { type: boolean }
        lock_days: { type: integer }
        earned: { type: string, description: decimal }
        status: { type: string }
        created_at: { type: string, format: date-time }

    PriceAlertRecord:
      type: object
      description: >-
        Prices are USD, exact decimals serialized as JSON strings (for
        example "65000.5"). `triggered_at` and `triggered_price` are present
        only once the alert has been met.
      required: [id, user_id, asset, target_price, direction, active, status, created_at]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        asset: { type: string }
        target_price: { type: string, description: 'decimal, USD' }
        direction: { type: string, enum: [above, below] }
        active: { type: boolean }
        status:
          type: string
          enum: [active, triggered]
          description: active while it waits; triggered once the price met it
        created_at: { type: string, format: date-time }
        triggered_at: { type: string, format: date-time }
        triggered_price: { type: string, description: 'decimal, the USD price it was met at' }

    PriceAlertLimitError:
      type: object
      description: >-
        409 answer when creating a price alert would go past the limit of
        active alerts. The limit is the same on every plan and only stops
        CREATING.
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string, enum: [ALERT_LIMIT_REACHED] }
            message: { type: string }
            details:
              type: object
              additionalProperties: false
              required: [plan, limite, actuales]
              properties:
                plan: { type: string, enum: [free, plus, pro] }
                limite:
                  type: integer
                  minimum: 1
                  description: How many active alerts a person can have
                actuales:
                  type: integer
                  minimum: 0
                  description: How many active alerts the person has now

    BudgetRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        label: { type: string }
        amount_limit: { type: integer }
        amount_spent: { type: integer }
        currency: { type: string }
        icon: { type: string }
        color: { type: string }
        period: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RecurringPaymentRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        label: { type: string }
        type: { type: string }
        amount: { type: integer }
        currency: { type: string }
        frequency: { type: string }
        next_date: { type: string, format: date }
        recipient_phone: { type: string, nullable: true }
        recipient_name: { type: string, nullable: true }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProofOfReservesResponse:
      type: object
      properties:
        as_of: { type: string }
        note: { type: string }
        currencies:
          type: array
          items:
            type: object
            properties:
              currency: { type: string }
              user_liabilities_minor: { type: integer }
              reserve_balance_minor: { type: integer }
              ratio_pct: { type: number }
