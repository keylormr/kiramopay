  # ── Virtual Cards (Phase 5) ────────────────────────────────────────────
  /api/v1/cards:
    post:
      tags: [Virtual Cards]
      summary: Create a virtual card
      description: >-
        The card is decorative: it belongs to no payment network and cannot
        spend outside the app. The person's plan limits how many cards can be
        active or frozen at once (by default free 1, plus 3, pro 5; the
        numbers in force are published in /api/v1/transparency/fees).
        Cancelled, expired and replaced cards do not count. The limit only
        stops creating: whoever already has more keeps every card. Two
        simultaneous creations cannot both slip past the limit.
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Card created
        '400':
          description: INVALID_BODY | CREATE_FAILED
        '409':
          description: CARD_LIMIT (the plan does not allow another active or frozen card)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanLimitError'
    get:
      tags: [Virtual Cards]
      summary: List user's virtual cards
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Card list

  /api/v1/cards/{id}:
    get:
      tags: [Virtual Cards]
      summary: Get card details
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Card details with masked number
    delete:
      tags: [Virtual Cards]
      summary: Cancel a virtual card
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Card cancelled

  /api/v1/cards/{id}/freeze:
