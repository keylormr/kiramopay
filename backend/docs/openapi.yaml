          description: The new state
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }
        '404':
          description: RECURRING_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/recurring/{id}/mark-paid:
    post:
      tags: [Recurring]
      summary: Record that the person already paid
      description: >-
        Sets last_paid_date to today and moves next_date one period forward
        (7 days, 14 days or one month; a month clamps to the last day, as
        Postgres does). It does not move any money: the person paid on their
        own (SINPE, services, recharge).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The reminder with its new dates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPayment'
        '404':
          description: RECURRING_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

