openapi: 3.0.3
info:
  title: KiramoPay API
  description: |
    KiramoPay is a fintech super app for Costa Rica. This API provides banking,
    payments, crypto exchange, marketplace integration, and more.
  version: 1.0.0
  contact:
    name: KiramoPay Team

servers:
  - url: http://localhost:8080
    description: Local development
  - url: http://kiramopay-api:8080
    description: Docker/Kubernetes internal

tags:
  - name: Auth
    description: Authentication and session management
  - name: Users
    description: User profile management
  - name: Wallets
    description: Wallet and balance operations
  - name: Transactions
    description: Financial transactions
  - name: SINPE
    description: Costa Rica SINPE transfers
  - name: Services
    description: Bill payments and recharges
  - name: Crypto
    description: Cryptocurrency operations
  - name: Marketplace
    description: Partner integrations (rides, food)
  - name: Loyalty
    description: Points, rewards, and cashback
  - name: QR Payments
    description: QR code-based payments
  - name: Split Payments
    description: Bill splitting
  - name: Virtual Cards
    description: Virtual card management
  - name: Savings
    description: Savings goals (money set aside in SYSTEM:SAVINGS; it earns nothing)
  - name: Budgets
    description: >-
      Spending budgets the person keeps by hand. The limit and the amount spent
      are both written by the person; no ledger movement updates them and
      nothing resets them on its own.
  - name: Recurring
    description: >-
      Reminders of payments that repeat. Nothing is ever charged or sent:
      mark-paid only records today's date and moves next_date forward.
  - name: Fraud
    description: Fraud detection and risk assessment
  - name: Multi-Country
    description: Cross-border and multi-currency operations
  - name: Notifications
    description: Push notifications and notification history
  - name: MFA
    description: Multi-factor authentication (OTP challenges + TOTP authenticator)
  - name: Escrow
    description: Ledger-backed escrow agreements (buyer-funded holds)
  - name: Payouts
    description: Ledger-backed outbound payments over pluggable settlement rails
  - name: Assistant
    description: Read-only conversational assistant (LLM behind the backend; no money movement)
  - name: B2B
    description: Merchant platform — API keys, webhooks and the API-key-authenticated merchant API
  - name: Plans
    description: Paid plans — interest only; there is no charging path in the app yet
  - name: Admin
    description: Administrative endpoints
  - name: System
    description: Health, metrics, and WebSocket

paths:
  # ── System ─────────────────────────────────────────────────────────────
  /health:
    get:
      tags: [System]
      summary: Health check
      description: Returns service health status including database and Redis connectivity.
      responses:
        '200':
          description: All services healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: One or more services degraded

  /metrics:
    get:
      tags: [System]
      summary: Prometheus metrics
      description: Returns Prometheus-compatible text exposition format with HTTP and Go runtime metrics.
      responses:
        '200':
          description: Metrics in text format
          content:
            text/plain:
              schema:
                type: string

  /ws/prices:
    get:
      tags: [System]
      summary: WebSocket crypto price feed
      description: |
        WebSocket endpoint for real-time cryptocurrency price updates.
        Sends `price_update` messages every 5 seconds with prices for BTC, ETH, SOL, ADA, DOT, AVAX, LINK, MATIC, UNI, ATOM.
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)

  /ws/notifications:
    get:
      tags: [Notifications]
      summary: WebSocket per-user notifications
      description: |
        Authenticated WebSocket endpoint for real-time notifications per user.
        After connecting, the client must send an auth message:
        `{"type":"auth","token":"<jwt_access_token>"}`
        The server responds with `{"type":"auth_ok"}` on success or `{"type":"auth_error","message":"..."}` on failure.
        Once authenticated, the server pushes notification messages:
        `{"type":"notification","notification":{...}}`
        Multiple connections from the same user all receive notifications.
      responses:
        '101':
          description: Switching Protocols (WebSocket upgrade)

  # ── Auth ───────────────────────────────────────────────────────────────
  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: >-
            Validation error (VALIDATION_ERROR), a cedula that would never work
            as a login identifier (CEDULA_INVALID: e.g. 11 digits starting with
            506, which classifies as a phone), or invitation code rejected
            (REFERRAL_CODE_INVALID: bad format, unknown code, or the referrer's
            account is not active).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            Phone verification is enforced and the verification token is
            missing, expired, or issued for another phone (PHONE_NOT_VERIFIED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The cedula, phone or email already belongs to an account
            (USER_EXISTS). The response never says which field collided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: >-
            Any other failure (REGISTER_FAILED). The message is the generic
            "internal server error"; clients decide by code. The cause is only
            logged server-side, never returned to the client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with cédula and PIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            CSRF validation failed / origin not allowed, or the account is
            blocked by an administrator (code ACCOUNT_BLOCKED, only after the
            password was verified so it cannot be used to enumerate accounts).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '423':
          $ref: '#/components/responses/Locked'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '403':
          $ref: '#/components/responses/AccountBlocked'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout (invalidate session)
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out

  /api/v1/auth/change-pin:
    post:
      tags: [Auth]
      summary: Change user PIN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_pin, new_pin]
              properties:
                old_pin:
                  type: string
                  example: "1234"
                new_pin:
                  type: string
                  example: "5678"
      responses:
        '200':
          $ref: '#/components/responses/Success'

  # ── Auth: open sessions, one per device  ──────────────────────────
  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      summary: List the devices with an open session
      description: >-
        Every login opens its own session and its own refresh family, and
        nothing revokes the previous ones, so an account stays open on as many
        devices as it was signed in from. This lists the live ones, most recent
        first, 50 at most, with `current` marking the session the request
        itself came from (matched by the access token's jti). It carries no
        tokens and no hashes: only what is needed to recognise a device and
        decide whether to close it.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Open sessions, most recent first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          description: UNAUTHORIZED | SESSION_REVOKED (this session was closed)
        '403':
          $ref: '#/components/responses/AccountBlocked'
        '500':
          description: SESSIONS_FAILED

  /api/v1/auth/sessions/{id}/revoke:
    post:
      tags: [Auth]
      summary: Close one of your own devices
      description: >-
        Closes a single session in one transaction that does two things: it
        marks the session row, so its access token is rejected on the very next
        request, and it revokes that session's whole refresh FAMILY. The second
        half is not optional — the access token only lasts fifteen minutes, so
        a device left holding a live refresh chain renews and walks straight
        back in: the session would look closed and would not be. The account id
        travels all the way into the WHERE clause, so a session id belonging to
        somebody else finds nothing to close and answers 404 without revealing
        that it exists elsewhere. Closing the session the request came from is
        allowed: that is "sign out of this device". Audited as session_revoked
        (high).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Session closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                    description: Always true; a session that was not closed answers 404
        '400':
          description: INVALID_ID (id is not a UUID)
        '401':
          description: UNAUTHORIZED | SESSION_REVOKED
        '403':
          $ref: '#/components/responses/AccountBlocked'
        '404':
          description: SESSION_NOT_FOUND (unknown, already closed, or another account's)
        '500':
          description: REVOKE_FAILED

  /api/v1/auth/sessions/revoke-others:
    post:
      tags: [Auth]
      summary: Close every other device and keep this one
      description: >-
        The "somebody else got into my account" button: closes every session
        except the one the request came from, each of them together with its
        refresh family, and answers how many it closed. The surviving session's
        refresh family is deliberately left alone — revoking it would kill this
        device at its next refresh and turn "close the others" into "close
        everything". Audited as sessions_revoked_others (high).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessions closed (0 when there was no other device)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsRevoked'
        '401':
          description: UNAUTHORIZED | SESSION_REVOKED
        '403':
          $ref: '#/components/responses/AccountBlocked'
        '500':
          description: REVOKE_FAILED

  # ── Users ──────────────────────────────────────────────────────────────
  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile (includes the user's own referral_code)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/UserProfile' }
    patch:
      tags: [Users]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/Success'

  # ── Wallets ────────────────────────────────────────────────────────────
  /api/v1/wallets/me:
    get:
      tags: [Wallets]
      summary: Get current user wallet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/WalletRecord' }

  /api/v1/wallets/me/balance:
    get:
      tags: [Wallets]
      summary: Get wallet balance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Balance in centimos
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/BalanceResponse' }

  # ── Transactions ───────────────────────────────────────────────────────
  /api/v1/transactions:
    post:
      tags: [Transactions]
      deprecated: true
      summary: Retired — always returns 400
      description: >-
        This endpoint no longer creates transactions. It used to accept a
        whitelist of seven "outgoing" types and post a SINGLE-SIDED ledger entry
        against SYSTEM:EXTERNAL — debiting the wallet while nothing on the other
        side delivered anything — bypassing the agreement lock that keeps bill
        payments and top-ups switched off, the recipient checks in the SINPE
        module, the merchant credit and commission on QR payments, and the
        crypto holdings credit. Every one of those movements has its own route
        that actually delivers; the error body names it
        (`USE_DEDICATED_ROUTE`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '400':
          description: >-
            Always. `USE_DEDICATED_ROUTE` when the type has a route that
            delivers it, `TYPE_NOT_ALLOWED` otherwise.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    get:
      tags: [Transactions]
      summary: List user transactions
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: type
          in: query
          schema: { type: string }
          description: Exact transaction type, e.g. `sinpe_send`.
        - name: status
          in: query
          schema: { type: string }
          description: Exact status, e.g. `completed`.
        - name: currency
          in: query
          schema: { type: string }
          description: Exact ISO currency code.
        - name: from
          in: query
          schema: { type: string }
          description: >-
            Inclusive lower bound on `created_at`. RFC3339 or `YYYY-MM-DD`. A
            malformed value is rejected with 400 rather than ignored: dropping
            it silently would return the whole history as if it matched.
        - name: to
          in: query
          schema: { type: string }
          description: >-
            Exclusive upper bound on `created_at`, same formats as `from`, so a
            calendar month is exactly [first, first-of-next).
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
          description: >-
            Free text, matched case-insensitively against the counterparty
            name, the description stored in `metadata`, the external reference
            and the transaction type. LIKE wildcards in the value are escaped:
            searching `50%` looks for that text, not for a wildcard. `total`
            in the response counts the matches, not the page.
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/transactions/summary:
    get:
      tags: [Transactions]
      summary: Summarize the user's completed transactions over a date range
      description: >-
        Aggregates EVERY completed transaction of the authenticated user in a
        range of Costa Rica calendar days (America/Costa_Rica): one group per
        (day, type, currency) plus the largest movements of each (type,
        currency). The analytics screen uses it instead of paging the list,
        which cannot cover a long range completely. The server does not decide
        what counts as income or expense: the type carries the direction, as
        in the list. Only `completed` rows count; a failed or pending movement
        moved no money. The documented schema is the `data` payload of the
        usual `{success, data}` envelope.
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
          description: First Costa Rica calendar day, inclusive (`YYYY-MM-DD`).
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
          description: >-
            Exclusive end day (`YYYY-MM-DD`), so August 2026 is
            `from=2026-08-01&to=2026-09-01`. Must be after `from`; the range
            may span at most 732 days.
      responses:
        '200':
          description: Aggregates of the range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSummary'
        '400':
          description: >-
            `VALIDATION_ERROR` when a bound is missing, is not a plain date,
            `to` is not after `from`, or the range is longer than 732 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /api/v1/transactions/{id}:
    get:
      tags: [Transactions]
      summary: Get transaction by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Transaction details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── SINPE ──────────────────────────────────────────────────────────────
  /api/v1/sinpe/contacts:
    get:
      tags: [SINPE]
      summary: Get SINPE contacts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Contact list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
    post:
      tags: [SINPE]
      summary: Add SINPE contact
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddSinpeContactRequest'
      responses:
        '201':
          description: Contact added
        '409':
          description: >-
            The phone is already saved as a contact (CONTACT_EXISTS). The
            existing contact is never overwritten in silence; `data` carries
            it as it stands today so the client can offer it instead of
            guessing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinpeContactConflict'

  /api/v1/sinpe/send:
    post:
      tags: [SINPE]
      summary: Send SINPE transfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SinpeSendRequest'
      responses:
        '200':
          description: Transfer completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SinpeSendResponse'

  /api/v1/sinpe/history:
    get:
      tags: [SINPE]
      summary: Get SINPE transfer history
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Transfer history

  # ── Services & Payments ────────────────────────────────────────────────
  /api/v1/services/pay-bill:
    post:
      tags: [Services]
      summary: Pay a bill
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayBillRequest'
      responses:
        '200':
          description: Bill paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayBillResponse'

  /api/v1/services/recharge:
    post:
      tags: [Services]
      summary: Mobile phone recharge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RechargeRequest'
      responses:
        '200':
          description: Recharge completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechargeResponse'

  /api/v1/services/saved:
    get:
      tags: [Services]
      summary: Get saved services
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saved services list
    post:
      tags: [Services]
      summary: Add a saved service
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Service saved

  /api/v1/services/history:
    get:
      tags: [Services]
      summary: Get payment history
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment history

  # ── Crypto ─────────────────────────────────────────────────────────────
  /api/v1/crypto/prices:
    get:
      tags: [Crypto]
      summary: Get current crypto prices (public)
      parameters:
        - name: symbols
          in: query
          schema: { type: string }
          description: >-
            Comma-separated symbols (e.g. BTC,ETH). Defaults to
            BTC,ETH,SOL,ADA,DOT.
      responses:
        '200':
          description: >-
            Current prices for the requested cryptocurrencies, keyed by
            symbol. A symbol the provider did not return (rate limit, unknown
            coin) is simply absent — never a fabricated price.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/CryptoPriceData'

  /api/v1/crypto/assets:
    get:
      tags: [Crypto]
      summary: Get user crypto portfolio
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User's crypto assets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CryptoAssetRecord'

  /api/v1/crypto/transactions:
    get:
      tags: [Crypto]
      summary: Get crypto transaction history
      description: >-
        The last 50 movements, newest first: buy, sell, convert, stake and
        unstake. Staking and withdrawing are recorded here in the same
        transaction that moves the asset, so this list is the whole history
        of the crypto balance.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Crypto transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CryptoTransactionRecord'

  /api/v1/crypto/buy:
    post:
      tags: [Crypto]
      summary: Buy cryptocurrency
      description: >-
        The client only decides how much of its fiat (`from_amount`, in
        `from_currency`) it spends; the crypto quantity and the unit price are
        set by the server. `price` is the USD unit price the screen showed
        (the feed quotes in USD): it is compared against the server's own USD
        price, whatever the currency the purchase is paid in, and a deviation
        above 2% is rejected with 409 PRICE_MOVED. Settlement uses the system
        USD/CRC exchange rate. The fiat debit, the asset credit and the
        purchase record commit in one transaction. Repeating a completed
        purchase with the same `idempotency_key` (same asset, `from_amount`
        and `from_currency`) returns the recorded purchase and moves nothing;
        a key that belongs to a different purchase gets 409
        LLAVE_REUTILIZADA. Both are answered before the price is consulted,
        so they work while the price feed is down or after the price moved.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoBuyRequest'
      responses:
        '201':
          description: Purchase completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoTransactionRecord'
        '400':
          description: >-
            CRYPTO_INVALID_AMOUNT, UNSUPPORTED_CURRENCY, INVALID_BODY, or
            BUY_FAILED when the risk engine blocked the payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            PRICE_MOVED — the USD price moved more than 2% since it was shown.
            LLAVE_REUTILIZADA — the `idempotency_key` belongs to a different
            asset, amount, currency or operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: INSUFFICIENT_BALANCE, DAILY_LIMIT_EXCEEDED or MONTHLY_LIMIT_EXCEEDED. Nothing moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '428':
          description: MFA_REQUIRED — verify a high_value_tx challenge and retry the same request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: BUY_FAILED with a generic message; the detail stays in the server log. Nothing moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: PRICE_UNAVAILABLE or PRICE_STALE — the server has no usable price right now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/crypto/sell:
    post:
      tags: [Crypto]
      summary: Sell cryptocurrency
      description: >-
        The client only decides how much crypto it sells; the fiat credited
        (in `to_currency`) is set by the server. `price` is the USD unit price
        the screen showed: it is compared against the server's USD price even
        when `to_currency` is CRC, and a deviation above 2% is rejected with
        409 PRICE_MOVED. The CRC credit uses the system USD/CRC exchange rate.
        The asset debit, the fiat credit (to the centimo, which is what
        `total` reports) and the sale record commit in one transaction.
        Repeating a completed sale with the same `idempotency_key` (same
        asset, `amount` and `to_currency`) returns the recorded sale, with the
        fiat credited then, and moves nothing; a key that belongs to a
        different sale gets 409 LLAVE_REUTILIZADA. Both are answered before
        the price is consulted, so they work while the price feed is down or
        after the price moved.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoSellRequest'
      responses:
        '201':
          description: Sale completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoTransactionRecord'
        '400':
          description: >-
            CRYPTO_INVALID_AMOUNT (not positive, more than 18 decimals, or worth
            less than one centimo), UNSUPPORTED_CURRENCY, or INVALID_BODY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            PRICE_MOVED — the USD price moved more than 2% since it was shown.
            LLAVE_REUTILIZADA — the `idempotency_key` belongs to a different
            asset, amount, currency or operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: CRYPTO_INSUFFICIENT_BALANCE — the asset balance does not cover `amount`. Nothing moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: SELL_FAILED with a generic message; the detail stays in the server log. Nothing moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: PRICE_UNAVAILABLE or PRICE_STALE — the server has no usable price right now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/crypto/send/preview:
    post:
      tags: [Crypto]
      summary: Quote a crypto send to another person
      description: >-
        Quotes a send without performing it: who receives it, how much reaches
        them and how much leaves the balance. The recipient is resolved from
        the QR code scanned from their profile — `qr_data` is the raw payload
        the camera read. There is no destination address: this crypto lives on
        no chain, so the only possible recipient is another KiramoPay person.
        The fee is KiramoPay's own, never a network fee: `fee_percent` of the
        amount, charged in the same asset and paid by the sender, so the
        recipient gets `amount` exactly and the sender's balance drops
        `total`. The screen must not compute these figures itself.
        This endpoint does NOT check the balance: `total` can exceed it, and
        the client is expected to say so before offering to confirm.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoSendRequest'
      responses:
        '200':
          description: Quote for the send
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoSendPreview'
        '400':
          description: >-
            CRYPTO_INVALID_AMOUNT (not positive or more than 18 decimals),
            QR_INVALIDO (the code does not exist or is not a KiramoPay code),
            CRYPTO_SEND_SELF (the scanned code is the sender's own), or
            INVALID_BODY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: QR_REVOCADO — the owner of that code withdrew it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            QR_DE_COMERCIO — that code belongs to a business, and businesses
            charge in colones or dollars. QR_DE_COBRO — that code requests an
            amount of money, not crypto; it is paid from Pay with QR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: SEND_PREVIEW_FAILED with a generic message; the detail stays in the server log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            CRYPTO_SEND_UNAVAILABLE — this deployment has no QR resolver wired,
            so it cannot know who would receive it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/crypto/send:
    post:
      tags: [Crypto]
      summary: Send crypto to another person
      description: >-
        Moves the asset from the sender to the person who owns the scanned QR.
        `amount` is what the recipient gets; what leaves the sender's balance
        is `amount` plus KiramoPay's fee, in the same asset. The debit, the
        credit, the fee and both history rows commit in one transaction.
        `price` is the USD unit price the screen showed: a deviation above 2%
        is rejected with 409 PRICE_MOVED. The send is also written to the
        wallet history in USD even though no fiat moves, because the daily
        limit and the AML monitoring are computed over that table; without a
        usable price the send is refused rather than counted as zero.
        Repeating a completed send with the same `idempotency_key` returns the
        recorded send and moves nothing; a key that belongs to a different
        amount or a different recipient gets 409 LLAVE_REUTILIZADA. Both are
        answered before the price is consulted, so they work while the price
        feed is down.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoSendRequest'
      responses:
        '201':
          description: >-
            Send completed. `fee` is KiramoPay's fee in the same asset, `total`
            is what left the balance, `currency` is the asset itself and
            `counterparty_name` is who received it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoTransactionRecord'
        '400':
          description: >-
            CRYPTO_INVALID_AMOUNT, QR_INVALIDO, CRYPTO_SEND_SELF, or
            INVALID_BODY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            PRICE_MOVED — the USD price moved more than 2% since it was shown.
            QR_REVOCADO — the owner of that code withdrew it.
            LLAVE_REUTILIZADA — the `idempotency_key` belongs to a different
            amount or a different recipient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            CRYPTO_INSUFFICIENT_BALANCE — the asset balance does not cover the
            amount plus the fee. QR_DE_COMERCIO or QR_DE_COBRO — that code is
            not a personal one. DAILY_LIMIT_EXCEEDED or MONTHLY_LIMIT_EXCEEDED
            — the USD value of the send passes the spending limit. Nothing moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '428':
          description: >-
            MFA_REQUIRED — the USD value passes the high-value threshold and
            there is no verified MFA challenge. Nothing moved: verify the
            challenge and retry with the SAME `idempotency_key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: SEND_FAILED with a generic message; the detail stays in the server log. Nothing moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            PRICE_UNAVAILABLE or PRICE_STALE — the server has no usable price
            right now. CRYPTO_SEND_UNAVAILABLE — this deployment has no QR
            resolver wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/crypto/convert:
    post:
      tags: [Crypto]
      summary: Convert between cryptocurrencies
      description: >-
        Converts `from_amount` of `from_asset` into `to_asset`. How much
        arrives is decided by the server from the two USD market prices, not
        by the client. Both balances and the `convert` movement commit in one
        transaction. Repeating a completed conversion with the same
        `idempotency_key` returns the recorded conversion, with what arrived
        then, and moves nothing; a key that belongs to a different pair, a
        different amount or another kind of movement gets 409
        LLAVE_REUTILIZADA. Both are answered before the prices are consulted,
        so they work while the price feed is down.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoConvertRequest'
      responses:
        '201':
          description: >-
            Conversion completed. `asset` is the pair (for example `BTC→ETH`),
            `amount` is what left the source asset, `total` is what arrived,
            in `currency` (the destination asset), and `price` is the
            destination's USD unit price.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CryptoTransactionRecord'
        '400':
          description: CRYPTO_INVALID_AMOUNT or INVALID_BODY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            LLAVE_REUTILIZADA — the `idempotency_key` belongs to a different
            pair, a different amount or another kind of movement. Nothing
            moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: CRYPTO_INSUFFICIENT_BALANCE — the source asset does not cover the amount. Nothing moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: CONVERT_FAILED with a generic message; the detail stays in the server log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: PRICE_UNAVAILABLE or PRICE_STALE — the server has no usable price for one of the two assets right now. Nothing moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/crypto/staking:
    get:
      tags: [Crypto]
      summary: Get staking positions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active staking positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StakingPositionRecord'
    post:
      tags: [Crypto]
      summary: Stake cryptocurrency
      description: >-
        Only the assets in the staking program can be staked (ETH and SOL).
        USDT and USDC were withdrawn from the program: a new position is
        rejected with STAKING_NOT_AVAILABLE, while positions opened before
        stay listed and can still be withdrawn. The rate is set by the server;
        earnings accrual is not live, so `earned` stays at zero. The asset set
        aside is recorded as a `stake` movement in the crypto history, in the
        same transaction; if it cannot be recorded, nothing moves. Repeating a
        completed stake with the same `idempotency_key` returns the position
        it opened and sets nothing aside again; a key that belongs to a
        different asset, amount or term, or to another kind of movement, gets
        409 LLAVE_REUTILIZADA. If the position that key opened was already
        withdrawn, the retry gets 409 STAKING_ALREADY_WITHDRAWN and nothing is
        set aside.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoStakeRequest'
      responses:
        '201':
          description: Staking initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingPositionRecord'
        '400':
          description: >-
            STAKING_NOT_AVAILABLE (the asset is not in the staking program),
            CRYPTO_INVALID_AMOUNT, or INVALID_BODY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            LLAVE_REUTILIZADA — the `idempotency_key` belongs to a different
            asset, amount or term, or to another kind of movement. Nothing
            moved. STAKING_ALREADY_WITHDRAWN — the key already opened a
            position and it was withdrawn; nothing moved, and staking again
            needs a new key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: CRYPTO_INSUFFICIENT_BALANCE — the asset does not cover the amount. Nothing moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: STAKE_FAILED with a generic message; the detail stays in the server log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/crypto/staking/{id}:
    delete:
      tags: [Crypto]
      summary: Unstake cryptocurrency
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: >-
            Unstaked; principal and earnings are back in the asset balance, and
            an `unstake` movement with the released quantity is in the crypto
            history. Both commit together.
        '404':
          description: STAKING_POSITION_NOT_FOUND — the position does not exist or belongs to someone else.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            STAKING_POSITION_INACTIVE — the position was already withdrawn.
            STAKING_POSITION_LOCKED — the lock period has not ended (the
            message carries the unlock date).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: UNSTAKE_FAILED with a generic message; the detail stays in the server log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/crypto/alerts:
    get:
      tags: [Crypto]
      summary: Get price alerts
      description: >-
        Every active alert of the caller (newest first), followed by the 20
        most recently triggered ones the caller has not removed (last
        triggered first). A background sweep checks active alerts about once a
        minute against the prices the server already has cached: it never
        calls the price provider on its own, and a stale price decides
        nothing. When an alert's condition is met (`above`: price >= target;
        `below`: price <= target) it becomes `triggered` exactly once, keeps
        the price and time it was met at, and the owner is notified in the app
        (and by web or native push if enabled) with a text that carries no
        amounts.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Price alert list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PriceAlertRecord'
    post:
      tags: [Crypto]
      summary: Create price alert
      description: >-
        `asset` must be one of the symbols the system quotes; `direction` is
        above or below; `target_price` is in USD (the feed currency), must be
        positive and at most 10,000,000, and — when a current market price is
        available — between 1/100 and 100 times that price and not already
        met by it. A person can have at most 20 active alerts (triggered ones
        do not count). Only asset, target_price and direction are read from
        the body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset, target_price, direction]
              properties:
                asset: { type: string, example: BTC }
                target_price:
                  description: USD, as a JSON number or a decimal string
                  oneOf:
                    - { type: number }
                    - { type: string }
                direction: { type: string, enum: [above, below] }
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertRecord'
        '400':
          description: >-
            ALERT_UNSUPPORTED_ASSET (the symbol is not quoted),
            ALERT_INVALID_DIRECTION, ALERT_PRICE_OUT_OF_RANGE,
            ALERT_ALREADY_MET (the current price already satisfies the
            alert), or INVALID_BODY.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ALERT_LIMIT_REACHED (the person already has 20 active alerts)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceAlertLimitError'
        '500':
          description: ALERT_FAILED with a generic message; the detail stays in the server log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/crypto/alerts/{id}:
    delete:
      tags: [Crypto]
      summary: Remove price alert
      description: >-
        Removes an active or triggered alert from the caller's list. The row
        is kept (switched off and stamped with when it was removed), not
        deleted. Removing an alert that does not exist, is not the caller's
        or was already removed does nothing and still answers 204.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Alert removed

