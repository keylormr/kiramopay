  # ── Plans ──────────────────────────────────────────────────────────────
  /api/v1/plans/interest:
    post:
      tags: [Plans]
      summary: Register interest in a paid plan
      description: >-
        Records that the authenticated person wants a paid plan. This is NOT a
        subscription and charges nothing: the app has no payment path for plans
        yet, so the only honest thing to store is the intent. Idempotent per
        (user, plan) — registering twice keeps a single row and refreshes its
        date. Audited as plan_interest (low); the plan is the only detail kept.
        Accepts plus and pro (personal plans) and analitica (merchant
        analytics). The retired negocio and cima plans are rejected with
        PLAN_INVALID; the rows registered for them before stay in the
        administrator's list.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanInterestRequest'
      responses:
        '200':
          description: Interest registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanInterest'
        '400':
          description: PLAN_INVALID (plan must be plus, pro or analitica) | INVALID_BODY
        '401':
          description: UNAUTHORIZED
        '500':
          description: INTEREST_FAILED

