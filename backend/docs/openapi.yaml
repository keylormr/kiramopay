      responses:
        '200':
          description: Merchant info

  /api/v1/qr/merchants:
    get:
      tags: [QR Payments]
      summary: List the merchants the user owns or works for
      description: >-
        Merchants the user owns come with role owner; the ones they work for,
        with their staff role. commission_bps is the rate the platform set.
        comision_efectiva_bps is the rate charged on a payment made now: the
        lower of commission_bps and 25 while promo_hasta is in the future
        (the entry promotion a merchant receives on its FIRST approval, for 3
        months), and commission_bps afterwards. promo_hasta is null for a
        merchant that never had the promotion. plan is base or analitica; only
        an administrator changes it while there is no charging.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Merchants (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Merchant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: FETCH_FAILED

  /api/v1/qr/merchants/{id}/report:
    get:
      tags: [QR Payments]
      summary: Sales report of a merchant (owner or manager)
      description: >-
        Calendar window of `days` days in the client's timezone, up to now.
        With the analitica plan the report also carries `comparison`: the same
        window moved `days` days back and cut at the same hour, so today's
        half day is not compared with a whole day. With the base plan
        `comparison` is absent. Anyone who is not the owner or a manager gets
        404, without learning whether the merchant exists.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        - name: tz
          in: query
          description: Client offset in minutes WEST of UTC, as JS getTimezoneOffset returns it (Costa Rica = 360)
          schema: { type: integer, minimum: -840, maximum: 840, default: 0 }
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantReport'
        '404':
          description: NOT_FOUND (unknown merchant, or the caller is not its owner or manager)

  /api/v1/qr/merchants/{id}/report.csv:
    get:
      tags: [QR Payments]
      summary: Export the sales report as CSV (owner or manager, analitica plan)
      description: >-
        Same window and access as the report, plus the analitica plan. The
        role is checked first: someone outside the team gets 404 and never
        learns which plan the merchant has.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
        - name: tz
          in: query
          description: Client offset in minutes WEST of UTC (Costa Rica = 360)
          schema: { type: integer, minimum: -840, maximum: 840, default: 0 }
      responses:
        '200':
          description: >-
            UTF-8 CSV with byte order mark, served as an attachment with
            Cache-Control no-store. Columns: seccion, desde, hasta, clave,
            nombre, bruto, comision, neto, cobros. seccion is dia, sucursal,
            cobrador, total or periodo_anterior. Amounts are units with two
            decimals, not centimos. Every cell that starts with = + - @, a tab
            or a carriage return is prefixed with an apostrophe, so a
            spreadsheet shows it as text instead of running it as a formula.
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="reporte-2026-09-07-a-2026-09-13.csv"'
          content:
            text/csv:
              schema:
                type: string
        '403':
          description: PLAN_REQUIRED (the merchant does not have the analitica plan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRequiredError'
        '404':
          description: NOT_FOUND (unknown merchant, or the caller is not its owner or manager)
        '500':
          description: EXPORT_FAILED

  /api/v1/qr/codes:
    post:
      tags: [QR Payments]
      summary: Create a QR code
      security:
        - bearerAuth: []
      responses:
        '201':
          description: QR code created
    get:
      tags: [QR Payments]
      summary: Get user's QR codes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: QR code list

  /api/v1/qr/pay:
    post:
      tags: [QR Payments]
      summary: Scan and pay via QR
      description: >-
        A payment at or above the second-factor threshold follows the same
        contract as POST /api/v1/sinpe/send: 428 MFA_REQUIRED, no money moves;
        the client verifies a high_value_tx challenge (POST
        /api/v1/mfa/totp/verify) and retries the same request, with the same
        idempotency_key on an open-amount code.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Payment completed
        '428':
          description: MFA_REQUIRED — verify the second factor and retry the same request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/qr/history:
    get:
      tags: [QR Payments]
      summary: Get QR payment history
      security:
        - bearerAuth: []
      responses:
        '200':
          description: QR payment history

  # ── Split Payments (Phase 5) ───────────────────────────────────────────
  /api/v1/splits:
    post:
      tags: [Split Payments]
      summary: Create a split payment group
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Split created
        '400':
          description: >-
            SPLIT_TITLE_REQUIRED, SPLIT_INVALID_AMOUNT (total_amount <= 0),
            SPLIT_PARTICIPANT_REQUIRED (no participants besides the creator),
            SPLIT_PHONE_REQUIRED (a participant has no phone), SPLIT_INVALID_PHONE,
            SPLIT_SELF_INCLUDED (a participant's phone resolves to the caller —
            their own share is added automatically), SPLIT_DUPLICATE_PARTICIPANT
            (same phone twice), SPLIT_TOTAL_TOO_SMALL (equal split: the total does
            not cover 1 minor unit per person), SPLIT_CUSTOM_AMOUNT_REQUIRED
            (split_type=custom: a participant amount <= 0),
            SPLIT_EXCEEDS_TOTAL (split_type=custom: the custom amounts add up to
            more than total_amount), SPLIT_PERCENTAGE_REQUIRED, SPLIT_PERCENTAGE_EXCEEDS_TOTAL,
            SPLIT_PERCENTAGE_ROUNDS_TO_ZERO (split_type=percentage), SPLIT_INVALID_TYPE
            (split_type is none of equal/custom/percentage), INVALID_REQUEST or
            INVALID_BODY. The response never carries a dynamic amount or name —
            those cases are all in minor units server-side; the client already
            has its own amounts in the display currency and should translate by
            `error.code`, not show `error.message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: SPLIT_ACCOUNT_NOT_FOUND — a participant's phone has no KiramoPay account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Split Payments]
      summary: List user's splits
      security:
        - bearerAuth: []
      responses:
        '200':
          description: >-
            Split list. Always an array: a user without splits gets `[]`,
            never `null` (every list response is normalized the same way).

  /api/v1/splits/{id}:
    get:
      tags: [Split Payments]
      summary: Get split details
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Split with shares
    delete:
      tags: [Split Payments]
      summary: Cancel a split
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Split cancelled

  /api/v1/splits/{id}/pay:
    post:
