<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover" />
    <!-- El color de la barra del navegador y de la PWA. Al cambiar de tema lo
         ajusta src/hooks/useBarrasDelSistema.ts. -->
    <meta name="theme-color" content="#050B18" />
    <meta name="color-scheme" content="dark light" />
    <!-- Antes de que llegue el CSS el lienzo ya es el fondo oscuro de la app,
         aunque el sistema este en claro (con solo el meta de arriba el
         navegador elige el esquema del sistema y pinta blanco). La raiz arranca
         con la clase dark; si la persona eligio el claro, la app se la quita y
         esta regla deja de aplicar. -->
    <style>
      html.dark { background-color: #050B18; color-scheme: dark; }
    </style>
    <meta name="description" content="KiramoPay - Tu super app financiera para Costa Rica" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
    <title>KiramoPay</title>
  </head>
  <body class="bg-background dark:bg-background-dark text-slate-900 dark:text-slate-100 transition-colors duration-200 overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
