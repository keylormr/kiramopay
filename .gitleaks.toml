# Configuracion de gitleaks (Secret Scan en CI).
# Solo se permiten aqui valores FIJOS de test o checksums publicos, nunca
# credenciales reales.
[extend]
useDefault = true

[allowlist]
description = "Fixtures de test conocidos y checksums publicos — no son credenciales"
regexes = [
  # Clave fija de cifrado de PII usada por internal/testutil en los tests de
  # integracion (se inyecta como GUC kiramopay.encryption_key de la DB de test).
  '''test-pii-encryption-key-0123456789ab''',
  # Token falso del BCCR que usan las pruebas de la fuente del tipo de cambio
  # (internal/country) para comprobar que el token viaja en el encabezado y no se
  # escribe en ningun error ni registro. No abre nada.
  '''tok-secreto-de-prueba-123''',
]
paths = [
  # Podfile.lock lista los SPEC CHECKSUMS de CocoaPods: SHA-1 de 40 caracteres
  # que la regla generic-api-key marca por entropia. Son hashes publicos del
  # codigo de cada pod —cualquiera los recalcula desde el podspec— y el archivo
  # se versiona justamente para que el build sea reproducible. No es un lugar
  # donde pueda haber un secreto.
  '''^ios/App/Podfile\.lock$''',
]
