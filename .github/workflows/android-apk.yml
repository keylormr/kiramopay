name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Notas del release, armadas desde el changelog de src/config/version.ts:
      # la descripcion que se ve en GitHub y el notas.json que el backend le
      # pasa al aviso de actualizacion de la app (internal/appversion). Va antes
      # del build para fallar enseguida si el tag no es la version del
      # changelog.
      # Un tag con build.gradle o el proyecto de iOS atrasados publica una app
      # que se cree la version anterior: con la actualizacion obligatoria, la
      # barrera no se iria nunca despues de instalarla.
      - name: Version sincronizada
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run check:version

      - name: Notas de la version
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/notas-de-version.mjs "$GITHUB_REF_NAME"

      # Avisos de la app instalada (FCM). Sin google-services.json,
      # PushNotifications.register() cierra la app en Android; por eso el mismo
      # secreto decide las dos cosas: si el archivo entra al build y si la app
      # ofrece activar los avisos (VITE_PUSH_NATIVO). Sin el secreto el APK sale
      # igual, sin avisos nativos, y Perfil lo dice.
      - name: Firebase (opcional)
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            echo "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
            echo "VITE_PUSH_NATIVO=1" >> "$GITHUB_ENV"
            echo "Firebase configurado: el APK trae avisos nativos."
          else
            echo "::notice::Sin GOOGLE_SERVICES_JSON_BASE64: el APK sale sin avisos nativos."
          fi

      - name: Build web bundle
        env:
          # El respaldo apuntaba a kiramopay.com — el dominio del FRONTEND. La
          # variable APK_API_URL nunca se definio, asi que el APK v2.0.0 nacio
          # llamando al SPA de Vercel en vez de a la API: nunca pudo funcionar.
          VITE_API_URL: ${{ vars.APK_API_URL || 'https://api.kiramopay.com' }}
          VITE_ANDROID_APK_URL: 'https://github.com/keylormr/kiramopay/releases/latest/download/kiramopay.apk'
        run: npm run build

      # Actualizacion interna: esta misma capa web, comprimida y firmada, para
      # los telefonos cuyo binario ya la puede correr; el manifiesto dice desde
      # que versionCode (scripts/paquete-web.mjs). Va ANTES de cap sync, que
      # reescribe archivos de android/ que entran en la huella de lo nativo.
      # Si falla (falta el secreto, no corresponde a la llave de
      # capacitor.config.ts, cualquier error), el release sale igual con el APK
      # y el AAB, sin paquete: esa version se instala por APK. El APK es la
      # salida de emergencia y no puede depender de este paso. La corrida
      # termina en rojo para que se note (ultimo paso).
      - name: Paquete de la actualizacion interna
        id: paquete
        continue-on-error: true
        env:
          LIVE_UPDATE_PRIVATE_KEY: ${{ secrets.LIVE_UPDATE_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/paquete-web.mjs android "$GITHUB_REF_NAME"

      # Capacitor 8 y sus plugins compilan con Java 21 (sourceCompatibility
      # VERSION_21 en sus build.gradle): con un JDK 17 Gradle no los compila.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # v3 instala el paquete `tools`, que Google retiro: el sdkmanager del
      # runner ya no lo encuentra y el paso falla antes de compilar. v4 instala
      # solo `platform-tools` (corregido en v4.0.2).
      - uses: android-actions/setup-android@v4

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kiramopay-release.jks"

      # Dos salidas de la misma compilacion y la misma firma: el APK, que es lo
      # que la gente instala de lado desde la pagina de releases, y el AAB, que
      # es el unico formato que Google Play acepta para publicar.
      - name: Build signed release APK and AAB
        working-directory: android
        env:
          KIRAMOPAY_KEYSTORE_FILE: ${{ runner.temp }}/kiramopay-release.jks
          KIRAMOPAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KIRAMOPAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KIRAMOPAY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk kiramopay.apk

      - name: Stage AAB
        run: cp android/app/build/outputs/bundle/release/app-release.aab kiramopay.aab

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiramopay-apk
          path: kiramopay.apk
          if-no-files-found: error

      # En una corrida a mano (sin tag) no hay release: el paquete queda como
      # artefacto para revisarlo.
      - name: Upload live update package
        if: steps.paquete.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kiramopay-web-android
          path: |
            kiramopay-web-android.zip
            actualizacion-android.json
          if-no-files-found: error

      # El AAB NO se adjunta a la release publica: no se puede instalar, y en la
      # pagina de descargas solo confundiria a quien viene por el APK. Queda como
      # artefacto de la corrida, que es de donde se sube a Play Console.
      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: kiramopay-aab
          path: kiramopay.aab
          if-no-files-found: error
          retention-days: 90

      # En dos tandas, y el APK al final: el backend ofrece la version recien
      # cuando ve el .apk, y para entonces las novedades y el paquete interno ya
      # tienen que estar. Si subieran juntos (la accion los sube en paralelo),
      # un telefono que pregunta en ese momento veria la version sin paquete y
      # se le pediria el APK; el backend cachea esa respuesta diez minutos.
      - name: Publish notes to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: notas-de-version.md
          files: notas.json
          fail_on_unmatched_files: true

      - name: Publish live update package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.paquete.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          body_path: notas-de-version.md
          files: |
            kiramopay-web-android.zip
            actualizacion-android.json
          fail_on_unmatched_files: true

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: notas-de-version.md
          files: kiramopay.apk
          fail_on_unmatched_files: true

      - name: Falta el paquete de la actualizacion interna
        if: steps.paquete.outcome == 'failure'
        run: |
          echo "::error::No se armo el paquete de la actualizacion interna (ver el paso 'Paquete de la actualizacion interna'). El APK salio igual: esta version se instala por APK."
          exit 1
