name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build web bundle
        env:
          # El respaldo apuntaba a kiramopay.com — el dominio del FRONTEND. La
          # variable APK_API_URL nunca se definio, asi que el APK v2.0.0 nacio
          # llamando al SPA de Vercel en vez de a la API: nunca pudo funcionar.
          VITE_API_URL: ${{ vars.APK_API_URL || 'https://api.kiramopay.com' }}
          VITE_ANDROID_APK_URL: 'https://github.com/keylormr/kiramopay/releases/latest/download/kiramopay.apk'
        run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Missing secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kiramopay-release.jks"

      # Dos salidas de la misma compilacion y la misma firma: el APK, que es lo
      # que la gente instala de lado desde la pagina de releases, y el AAB, que
      # es el unico formato que Google Play acepta para publicar.
      - name: Build signed release APK and AAB
        working-directory: android
        env:
          KIRAMOPAY_KEYSTORE_FILE: ${{ runner.temp }}/kiramopay-release.jks
          KIRAMOPAY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KIRAMOPAY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KIRAMOPAY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: cp android/app/build/outputs/apk/release/app-release.apk kiramopay.apk

      - name: Stage AAB
        run: cp android/app/build/outputs/bundle/release/app-release.aab kiramopay.aab

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiramopay-apk
          path: kiramopay.apk
          if-no-files-found: error

      # El AAB NO se adjunta a la release publica: no se puede instalar, y en la
      # pagina de descargas solo confundiria a quien viene por el APK. Queda como
      # artefacto de la corrida, que es de donde se sube a Play Console.
      - name: Upload Play Store bundle
        uses: actions/upload-artifact@v4
        with:
          name: kiramopay-aab
          path: kiramopay.aab
          if-no-files-found: error
          retention-days: 90

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: kiramopay.apk
          fail_on_unmatched_files: true
